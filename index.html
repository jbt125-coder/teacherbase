<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Classroom Hub</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #141b26;
    color: #eef1f4;
    -webkit-user-select: none; user-select: none;
  }
  #desk {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }

/* ––––– Top marquee bar ––––– */
#topbar {
position: absolute; top: 0; left: 0; right: 0; height: 42px;
background: linear-gradient(180deg,#20293a,#161d29);
border-bottom: 1px solid #2c3a4f;
display: flex; align-items: stretch;
z-index: 500;
}
#marqueeWrap {
flex: 1; position: relative; overflow: hidden;
display: flex; align-items: center;
}
#marqueeTrack {
position: absolute; white-space: nowrap; will-change: transform;
font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
color: #ffd98e;
padding-left: 100%;
}
#marqueeEditBtn {
width: 42px; flex-shrink: 0; border: none; background: transparent; color: #7fa8c9;
font-size: 18px; cursor: pointer; border-left: 1px solid #2c3a4f;
}
#cogBtn {
width: 42px; flex-shrink: 0; border: none; background: transparent; color: #9fb4c7;
font-size: 19px; cursor: pointer; border-left: 1px solid #2c3a4f;
}
#cogBtn:active, #marqueeEditBtn:active { background: #263349; }

/* ––––– Canvas where windows live ––––– */
#canvas {
position: absolute; top: 42px; left: 0; right: 0; bottom: 40px;
overflow: auto;
-webkit-overflow-scrolling: touch;
}
#canvasInner {
position: relative;
min-width: 100%; min-height: 100%;
}

/* ––––– Window ––––– */
.win {
position: absolute;
background: #f7f5f0;
color: #24303f;
border-radius: 10px;
box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.06);
display: flex; flex-direction: column;
overflow: hidden;
min-width: 180px; min-height: 130px;
transition: box-shadow .15s, opacity .35s, transform .35s;
}
.win.dragging { box-shadow: 0 18px 40px rgba(0,0,0,0.5); }
.win.private { box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 2px #e0a640; }
.win.annotationWin {
background: transparent !important;
box-shadow: 0 0 0 1px rgba(255,255,255,0.25), 0 6px 20px rgba(0,0,0,0.25) !important;
flex-direction: column-reverse;
}
.win.annotationWin .winHead {
border-bottom: none;
border-top: 1px solid rgba(255,255,255,0.15);
}
.winHead {
height: 34px; flex-shrink: 0;
background: #e7e2d6;
display: flex; align-items: center;
padding: 0 8px;
cursor: grab;
border-bottom: 1px solid #dcd6c6;
}
.winHead:active { cursor: grabbing; }
.winTitle {
flex: 1; font-size: 13px; font-weight: 700; color: #4a4030;
white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
letter-spacing: 0.2px;
}
.winBtn {
width: 24px; height: 24px; border: none; border-radius: 6px;
background: transparent; color: #6b6152; font-size: 13px; cursor: pointer;
display: flex; align-items: center; justify-content: center; margin-left: 2px;
}
.winBtn:active { background: rgba(0,0,0,0.08); }
.winBtn.close:active { background: #d8564a; color: #fff; }
.winBtn.deleteForever { color: #a3453a; font-size: 12px; }
.winBtn.deleteForever:active { background: #d8564a; color: #fff; }
.winBody { flex: 1; overflow: auto; position: relative; }
.resizeHandle {
position: absolute; right: 0; bottom: 0; width: 22px; height: 22px;
cursor: nwse-resize;
background: linear-gradient(135deg, transparent 50%, #b9b09b 50%);
border-bottom-right-radius: 10px;
}
.privTag {
position: absolute; top: 6px; right: 30px; font-size: 10px; font-weight: 800;
color: #8a5a00; background: #ffe3ad; padding: 2px 6px; border-radius: 5px;
letter-spacing: 0.4px; pointer-events: none;
}
.winHead .privTag { position: static; margin-right: 6px; }

/* window sending animation */
.win.sending {
transform: translateX(140vw) scale(0.85);
opacity: 0;
}
.win.arriving-back {
animation: arriveBack .35s ease-out;
}
@keyframes arriveBack {
from { transform: translateX(60px); opacity: 0; }
to { transform: translateX(0); opacity: 1; }
}

/* ––––– Bellwork window content ––––– */
.bellworkArea {
width: 100%; height: 100%; border: none; resize: none;
padding: 14px 16px; font-size: 16px; line-height: 1.5;
font-family: -apple-system, sans-serif; color: #2b2318;
background: #fffdf7;
}
.bellworkArea:focus { outline: none; background: #fffef9; }

/* ––––– Timer ––––– */
.timerBody {
display: flex; flex-direction: column; align-items: center; justify-content: center;
height: 100%; gap: 10px; padding: 10px;
}
.timerDigits {
font-family: "SF Mono", "Menlo", monospace; font-size: 15vmin; max-font-size: 54px;
font-size: clamp(30px, 12vmin, 60px);
font-weight: 700; color: #1d3d3a; letter-spacing: 1px;
}
.timerDigits.running { color: #1f8f7d; }
.timerDigits.done { color: #c1442e; animation: pulse 0.6s infinite alternate; }
@keyframes pulse { from{opacity:1;} to{opacity:0.4;} }
.timerBtnRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tBtn {
border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700;
background: #dcd6c6; color: #3a3327; cursor: pointer;
}
.tBtn.go { background: #1f8f7d; color: #fff; }
.tBtn:active { filter: brightness(0.92); }
.timeSetRow { display: flex; gap: 6px; align-items: center; }
.timeSetRow input {
width: 70px; border: 1px solid #c9c2ac; border-radius: 6px; padding: 6px 8px; font-size: 13px; text-align: center;
}

/* ––––– YouTube window ––––– */
.ytBody { height: 100%; display: flex; flex-direction: column; }
.ytInputRow { display: flex; gap: 6px; padding: 8px; background: #efeade; border-bottom: 1px solid #dcd6c6; }
.ytInputRow input {
flex: 1; border: 1px solid #c9c2ac; border-radius: 6px; padding: 7px 9px; font-size: 13px;
}
.ytInputRow button {
border: none; border-radius: 6px; padding: 7px 12px; background: #1f8f7d; color: #fff;
font-size: 13px; font-weight: 700; cursor: pointer;
}
.ytFrameWrap { flex: 1; background: #000; position: relative; }
.ytFrameWrap iframe { width: 100%; height: 100%; border: none; }
.ytPlaceholder {
position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
color: #8a8f96; font-size: 13px; text-align: center; padding: 20px; background: #1a1f26;
}

/* ––––– Sign-in / QR window ––––– */
.signBody { padding: 14px; height: 100%; overflow: auto; }
.qrBox {
width: 100%; max-width: 220px; margin: 0 auto 12px; aspect-ratio: 1/1;
background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center;
border: 1px solid #dcd6c6;
}
.qrBox img { width: 100%; height: 100%; border-radius: 6px; }
.joinLine { text-align: center; font-size: 12px; color: #6b6152; margin-bottom: 10px; word-break: break-all; }
.rosterList { list-style: none; margin: 0; padding: 0; }
.rosterList li {
display: flex; align-items: center; gap: 8px;
padding: 7px 8px; border-bottom: 1px solid #ece7d9; font-size: 13px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: #1f8f7d; flex-shrink: 0; }
.rosterEmpty { text-align: center; color: #9a9282; font-size: 12px; padding: 14px; }

/* ––––– Answers window (private) ––––– */
.ansBody { height: 100%; display: flex; flex-direction: column; }
.ansToolbar {
display: flex; gap: 6px; padding: 7px 8px; background: #efeade; border-bottom: 1px solid #dcd6c6;
align-items: center;
}
.ansToolbar input {
flex: 1; border: 1px solid #c9c2ac; border-radius: 6px; padding: 6px 8px; font-size: 12px;
}
.ansToolbar button {
border: none; border-radius: 6px; padding: 6px 10px; background: #6b6152; color: #fff;
font-size: 11px; font-weight: 700; cursor: pointer;
}
.ansFeed { flex: 1; overflow: auto; padding: 8px; font-family: "SF Mono", Menlo, monospace; font-size: 12px; }
.ansItem {
background: #fff; border: 1px solid #e2ddcf; border-radius: 7px; padding: 7px 9px; margin-bottom: 6px;
}
.ansItem .who { font-weight: 700; color: #1f8f7d; }
.ansItem .txt { color: #2b2318; margin-top: 2px; }
.ansEmpty { text-align: center; color: #9a9282; font-size: 12px; padding: 20px; }

/* ––––– Random Spinner window ––––– */
.spinBody { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px; gap: 8px; overflow: auto; }
.spinModeRow { display: flex; gap: 6px; }
.spinModeBtn {
border: 1px solid #c9c2ac; background: #efeade; color: #4a4030; border-radius: 8px;
padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.spinModeBtn.active { background: #1f8f7d; color: #fff; border-color: #1f8f7d; }
.spinRangeRow { width: 100%; display: flex; gap: 8px; align-items: center; justify-content: center; }
.spinRangeRow input {
width: 64px; border: 1px solid #c9c2ac; border-radius: 6px; padding: 6px 8px; font-size: 13px; text-align: center;
}
.spinToLabel { font-size: 12px; font-weight: 700; color: #6b6152; }
.spinListRow { width: 100%; display: flex; gap: 6px; align-items: flex-start; }
.spinListInput {
flex: 1; border: 1px solid #c9c2ac; border-radius: 6px; padding: 6px 8px; font-size: 12px;
font-family: inherit; resize: vertical; min-height: 34px;
}
.spinWheelWrap { position: relative; width: 200px; height: 200px; flex-shrink: 0; }
.spinCanvas { width: 200px; height: 200px; border-radius: 50%; display: block; }
.spinPointer {
position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent;
border-top: 15px solid #c1442e; z-index: 2; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
}
.spinResult { font-size: 15px; font-weight: 800; color: #2b2318; min-height: 20px; text-align: center; }
.spinResult.spinning { color: #8a8f96; font-weight: 600; }
.spinResult.done { color: #1f8f7d; }

/* ––––– Exit Slip window ––––– */
.exitBody { height: 100%; display: flex; flex-direction: column; }
.exitQWrap { padding: 8px; background: #efeade; border-bottom: 1px solid #dcd6c6; }
.exitQLabel { display: block; font-size: 10px; font-weight: 700; color: #6b6152; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }

/* ––––– Transparency Overlay window ––––– */
.annoBody { height: 100%; display: flex; flex-direction: column-reverse; }
.annoToolbar {
display: flex; align-items: center; gap: 6px; padding: 6px 8px; flex-wrap: wrap; flex-shrink: 0;
background: rgba(20,27,38,0.55);
}
.annoColors { display: flex; gap: 4px; }
.annoSwatch {
width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); cursor: pointer; padding: 0;
}
.annoSwatch.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.45); }
.annoWidths { display: flex; gap: 4px; }
.annoWidthBtn, .annoEraseBtn, .annoClearBtn {
border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); color: #fff;
border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 700; cursor: pointer;
}
.annoWidthBtn.active, .annoEraseBtn.active { background: #fff; color: #222; }
.annoCanvasWrap { flex: 1; position: relative; min-height: 0; }
.annoCanvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

/* ––––– Rich text editor (Bellwork, Quick Note, Exit Slip question) ––––– */
.richWrap { height: 100%; display: flex; flex-direction: column; }
.richToolbar {
display: flex; gap: 4px; align-items: center; padding: 6px 8px; background: #efeade;
border-bottom: 1px solid #dcd6c6; flex-shrink: 0; flex-wrap: wrap;
}
.richBtn {
width: 26px; height: 26px; border: 1px solid #c9c2ac; border-radius: 5px; background: #fff;
color: #4a4030; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.richBtn:active { background: #e7e2d6; }
.richSizeSelect {
border: 1px solid #c9c2ac; border-radius: 5px; background: #fff; color: #4a4030;
font-size: 12px; padding: 4px 6px;
}
.richColor { width: 28px; height: 26px; border: 1px solid #c9c2ac; border-radius: 5px; padding: 1px; cursor: pointer; background: #fff; }
.richEditable {
flex: 1; overflow: auto; padding: 14px 16px; font-size: 16px; line-height: 1.5;
font-family: -apple-system, sans-serif; color: #2b2318; background: #fffdf7; outline: none;
}
.richEditable img { max-width: 100%; border-radius: 6px; display: block; margin: 6px 0; }
.imgResizeWrap { position: relative; display: inline-block; max-width: 100%; vertical-align: bottom; }
.imgResizeWrap.selected { outline: 2px solid #1f8f7d; outline-offset: 2px; border-radius: 6px; }
.imgResizeHandle {
display: none; position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px;
background: #1f8f7d; border: 2px solid #fff; border-radius: 4px; cursor: nwse-resize; z-index: 2;
}
.imgResizeWrap.selected .imgResizeHandle { display: block; }
.richEditable a { color: #1f6f9c; text-decoration: underline; cursor: pointer; }
.richEditable table { border-collapse: collapse; margin: 8px 0; }
.richEditable table td, .richEditable table th { border: 1px solid #c9c2ac; padding: 6px 10px; min-width: 40px; }
.richEditable:empty:before { content: attr(data-placeholder); color: #a89f8c; pointer-events: none; }
.richBtnWide {
height: 26px; padding: 0 8px; border: 1px solid #c9c2ac; border-radius: 5px; background: #fff;
color: #4a4030; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.richBtnWide:active { background: #e7e2d6; }
.exitQRich .richToolbar { padding: 4px 6px; }
.exitQRich .richEditable { flex: none; min-height: 50px; max-height: 140px; padding: 8px; font-size: 13px; background: #fff; }

/* ––––– Dock (minimized / off-screen tabs) ––––– */
#dock {
position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
background: #10161f; border-top: 1px solid #24304199;
display: flex; align-items: center; gap: 6px; padding: 0 8px;
overflow-x: auto; z-index: 500;
}
.dockChip {
flex-shrink: 0; height: 28px; padding: 0 12px; border-radius: 14px;
background: #223047; color: #cfe0ee; font-size: 12px; font-weight: 600;
display: flex; align-items: center; gap: 6px; cursor: pointer; border: 1px solid #2f4160;
}
.dockChip.private { background: #3a3220; color: #ffd98e; border-color: #6b571f; }
.dockChip .dot2 { width: 6px; height: 6px; border-radius: 50%; background: #3d9b8f; }
.dockHint { font-size: 11px; color: #52627a; margin-left: auto; flex-shrink: 0; padding-right: 4px; }

/* ––––– Ghost tab (sent-away preview strip) ––––– */
#ghostRail {
position: absolute; top: 42px; right: 0; bottom: 40px; width: 14px;
z-index: 400; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-top: 12px;
pointer-events: none;
}
.ghostTab {
pointer-events: auto;
width: 14px; height: 60px; background: #e0a640; border-radius: 6px 0 0 6px;
cursor: pointer; box-shadow: -2px 2px 8px rgba(0,0,0,0.3);
}

/* ––––– Modal (cog settings) ––––– */
.modalOverlay {
position: fixed; inset: 0; background: rgba(10,14,20,0.6); z-index: 1000;
display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modalCard {
background: #1c2534; border: 1px solid #2f3d52; border-radius: 14px;
width: 100%; max-width: 380px; max-height: 86vh; overflow: auto;
padding: 18px; color: #e6ebf1;
}
.modalCard h3 { margin: 0 0 12px; font-size: 16px; letter-spacing: 0.2px; }
.modalSection { margin-bottom: 18px; }
.modalSection label { display: block; font-size: 11px; color: #8fa3ba; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
.addWinGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.addWinBtn {
border: 1px solid #35455c; background: #242f42; color: #dce6f0; border-radius: 9px;
padding: 10px 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: left;
}
.addWinBtn:active { background: #2c3a52; }
.addWinBtn.soon { opacity: 0.45; }
.themeGrid { display: flex; gap: 10px; flex-wrap: wrap; }
.themeSwatch {
width: 42px; height: 42px; border-radius: 10px; cursor: pointer; border: 2px solid transparent;
display: flex; align-items: flex-end; justify-content: flex-end; padding: 3px;
}
.themeSwatch.active { border-color: #fff; }
.modalCloseBtn {
width: 100%; margin-top: 4px; border: none; border-radius: 9px; padding: 11px; background: #2f3d52;
color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
}
.exportBtn {
width: 100%; border: none; border-radius: 9px; padding: 11px; background: #1f8f7d;
color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 8px;
}
.comingSoonNote { font-size: 11px; color: #6f83a0; margin-top: 6px; line-height: 1.4; }

.modalSelect {
width: 100%; border: 1px solid #35455c; background: #242f42; color: #dce6f0; border-radius: 8px;
padding: 9px 8px; font-size: 13px; margin-bottom: 8px; font-family: inherit;
}
.inlineRow { display: flex; gap: 8px; align-items: flex-start; }
.inlineRow .modalSelect { flex: 1; }
.smallBtn {
border: 1px solid #35455c; background: #242f42; color: #dce6f0; border-radius: 8px;
padding: 9px 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.smallBtn:active { background: #2c3a52; }
.calWrap { margin-bottom: 12px; }
.calNavRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.calNavBtn {
border: 1px solid #35455c; background: #242f42; color: #dce6f0; border-radius: 6px;
width: 28px; height: 28px; flex-shrink: 0; font-size: 14px; cursor: pointer;
}
.calNavBtn:active { background: #2c3a52; }
.calNavBtn:disabled { opacity: 0.3; cursor: default; }
.calMonthLabel { flex: 1; text-align: center; font-size: 14px; font-weight: 700; color: #e6ebf1; }
.calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.calDowCell { font-size: 10px; font-weight: 700; color: #8fa3ba; text-align: center; padding-bottom: 3px; }
.calDayCell {
position: relative; aspect-ratio: 1/1; border: 1px solid #35455c; background: #242f42; color: #dce6f0;
border-radius: 6px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
padding: 0;
}
.calDayCell:active { background: #2c3a52; }
.calDayCell.today { border-color: #1f8f7d; border-width: 2px; font-weight: 800; color: #fff; }
.calDayCell.hasLesson { background: #1f3d38; }
.calDayBlank { background: transparent; border: none; cursor: default; }
.calDot { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: #3ddc9c; }
.lessonListLabel { font-size: 11px; color: #8fa3ba; margin-bottom: 4px; }
.lessonChipRow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.lessonChip {
font-size: 11px; padding: 6px 10px; border-radius: 12px; background: #223047; color: #cfe0ee;
cursor: pointer; border: 1px solid #2f4160;
}
.lessonChip:active { background: #2c3a52; }
.lessonEmpty { font-size: 11px; color: #6f83a0; }
.stdList { max-height: 240px; overflow-y: auto; border: 1px solid #35455c; border-radius: 9px; margin-bottom: 8px; }
.stdItem { padding: 9px 10px; border-bottom: 1px solid #2c3a4f; cursor: pointer; }
.stdItem:last-child { border-bottom: none; }
.stdItem:active { background: #202b3d; }
.stdItem.selected { background: #1f8f7d; }
.stdCode { font-size: 11px; font-weight: 800; color: #8fa3ba; letter-spacing: 0.3px; margin-bottom: 3px; }
.stdItem.selected .stdCode { color: #d6f5ee; }
.stdText { font-size: 12.5px; color: #dce6f0; line-height: 1.4; }
.stdItem.selected .stdText { color: #fff; }
.stdEmpty { padding: 14px; font-size: 12px; color: #6f83a0; text-align: center; }
.schedList { border: 1px solid #35455c; border-radius: 9px; margin-bottom: 8px; max-height: 180px; overflow-y: auto; }
.schedRow { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-bottom: 1px solid #2c3a4f; }
.schedRow:last-child { border-bottom: none; }
.schedName { font-size: 13px; font-weight: 700; color: #dce6f0; }
.schedMeta { font-size: 11px; color: #8fa3ba; margin-top: 1px; }
.schedBtns { display: flex; gap: 4px; flex-shrink: 0; }
.dayAssignGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
.dayAssignCell { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.dayAssignCell label { font-size: 10px; color: #8fa3ba; font-weight: 700; text-transform: uppercase; }
.dayAssignCell select {
width: 100%; font-size: 11px; padding: 5px 2px; border-radius: 6px; border: 1px solid #35455c;
background: #242f42; color: #dce6f0;
}
.storBarWrap { margin-bottom: 8px; }
.storBarLabel { font-size: 11px; color: #8fa3ba; margin-bottom: 5px; }
.storBarTrack { height: 8px; border-radius: 4px; background: #242f42; overflow: hidden; border: 1px solid #35455c; }

  function defaultState(){
    return {
      theme: "slate",
      marquee: "Welcome! Bellwork is on the board.  \u2022  Have your Chromebooks charged.  \u2022  Quiz Friday!",

  function migrateState(s){
    if (!s.standardsSets) s.standardsSets = defaultStandardsSets();
    if (!s.classes || !s.classes.length){
      s.classes = [{ id: "class1", name: s.className || "My Class", standardsSetId: "fl_ess", lessons: {} }];
    }
    for (var i=0;i<s.classes.length;i++){
      if (!s.classes[i].lessons) s.classes[i].lessons = {};
    }
    if (!s.currentClassId) s.currentClassId = s.classes[0].id;
    if (!s.bellSchedules) s.bellSchedules = defaultBellSchedules();
    if (!s.bellScheduleAssignments) s.bellScheduleAssignments = { 1: "monday", 2: "tuesFri", 3: "tuesFri", 4: "tuesFri", 5: "tuesFri" };
    if (!s.scheduleDateOverrides) s.scheduleDateOverrides = {};
    return s;
  }

  function getCurrentClass(){
    for (var i=0;i<state.classes.length;i++){ if (state.classes[i].id === state.currentClassId) return state.classes[i]; }
    return state.classes[0];
  }

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.windows) return migrateState(parsed);
      }
    } catch(e){}
    return defaultState();
  }

  function saveState(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e){
      alert("This change couldn't be saved (your browser's storage is full). Try removing a large image, GIF, or drawing, then try again.");
    }
  }

  state = loadState();

  /* ============================================================
     THEME
  ============================================================ */
  function applyTheme(){
    var t = THEMES[state.theme] || THEMES.slate;
    document.getElementById("desk").style.background = t.desk;
    document.body.style.background = t.desk;
    document.getElementById("canvas").style.background = t.desk;
    document.getElementById("topbar").style.background = "linear-gradient(180deg," + t.bar1 + "," + t.bar2 + ")";
    document.getElementById("dock").style.background = t.bar2;

    for (var i=0;i<wins.length;i++){ wins[i].style.background = t.win; }

      ".winTitle{color:"+t.winText+" !important;}" +
      ".winBtn{color:"+t.winText+" !important;}" +
      ".bellworkArea, .richEditable{background:"+t.bodyBg+" !important;}" +
      ".ytInputRow, .ansToolbar, .richToolbar{background:"+t.winHead+" !important;border-bottom-color:"+t.winHeadBorder+" !important;}" +
      ".resizeHandle{background:linear-gradient(135deg, transparent 50%, "+t.winHeadBorder+" 50%) !important;}" +
      ".tBtn{background:"+t.winHeadBorder+" !important;color:"+t.winText+" !important;}" +
      ".tBtn.go{background:"+t.accent+" !important;color:#fff !important;}" +
      ".timerDigits.running{color:"+t.accent+" !important;}" +
      ".dot{background:"+t.accent+" !important;}" +
      ".dot2{background:"+t.accent+" !important;}" +
      ".ytInputRow button{background:"+t.accent+" !important;}" +

  }

  /* ============================================================
     CANVAS / WINDOW MANAGEMENT
  ============================================================ */
  var canvas = document.getElementById("canvas");
  var canvasInner = document.getElementById("canvasInner");
  var dock = document.getElementById("dock");
  var ghostRail = document.getElementById("ghostRail");

  function getWin(id){
    for (var i=0;i<state.windows.length;i++){ if (state.windows[i].id === id) return state.windows[i]; }
    return null;
  }

  function getWinByType(type){
    for (var i=0;i<state.windows.length;i++){ if (state.windows[i].type === type) return state.windows[i]; }
    return null;
  }

  function bringToFront(w){
    Z += 1; w.z = Z;
    var el = document.getElementById("winel_"+w.id);
    if (el) el.style.zIndex = Z;
  }

  function updateCanvasExtent(){
    var maxRight = canvas.clientWidth;
    var maxBottom = canvas.clientHeight;
    for (var i=0;i<state.windows.length;i++){
      var w = state.windows[i];
      if (w.closed || w.sentAway) continue;
      var right = w.x + w.w + 60;
      var bottom = w.y + w.h + 60;
      if (right > maxRight) maxRight = right;
      if (bottom > maxBottom) maxBottom = bottom;
    }
    canvasInner.style.width = maxRight + "px";
    canvasInner.style.height = maxBottom + "px";
  }

  function renderAll(){
    canvasInner.innerHTML = "";
    dock.innerHTML = "";
    ghostRail.innerHTML = "";
    for (var i=0;i<state.windows.length;i++){
      renderWindow(state.windows[i]);
    }
    renderDockAndGhosts();
    updateCanvasExtent();
    applyTheme();
  }

  function renderDockAndGhosts(){
    var anyClosed = false, anySent = false;
    for (var i=0;i<state.windows.length;i++){
      var w = state.windows[i];
      if (w.closed){
        anyClosed = true;
        var chip = document.createElement("div");
        chip.className = "dockChip";
        chip.innerHTML = '<span class="dot2"></span><span>' + escapeHtml(w.title) + '</span>';
        (function(win){ chip.onclick = function(){ win.closed = false; bringToFront(win); saveState(); renderAll(); }; })(w);
        dock.appendChild(chip);
      }
      if (w.sentAway && !w.closed){
        anySent = true;
        var gt = document.createElement("div");
        gt.className = "ghostTab";
        gt.title = "Bring back: " + w.title;
        (function(win){ gt.onclick = function(){ win.sentAway = false; bringToFront(win); saveState(); renderAll(); }; })(w);
        ghostRail.appendChild(gt);

        var chip2 = document.createElement("div");
        chip2.className = "dockChip private";
        chip2.innerHTML = '<span>&#128274;</span><span>' + escapeHtml(w.title) + ' (2nd screen)</span>';
        (function(win){ chip2.onclick = function(){ win.sentAway = false; bringToFront(win); saveState(); renderAll(); }; })(w);
        dock.appendChild(chip2);
      }
    }
    var hint = document.createElement("div");
    hint.className = "dockHint";
    hint.textContent = (anyClosed || anySent) ? "" : "Closed & sent-away windows appear here";
    dock.appendChild(hint);
  }

  function escapeHtml(s){
    return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function getJoinUrl(){
    var href = location.href;
    var usable = /^https?:\/\//i.test(href);
    if (usable){
      return href.split("#")[0] + "#join";
    }
    // File opened locally (file://) or in a sandboxed preview: no real shareable
    // web address exists yet, so the QR/link can't point students anywhere real
    // until this file is hosted (e.g. GitHub Pages). Flag that clearly instead
    // of silently producing a broken image.
    return "NEEDS_HOSTING";

  function renderWindow(w){
    if (w.closed || w.sentAway) return;

    var el = document.createElement("div");
    el.className = "win" + (w.privateFlag ? " private" : "") + (w.type === "annotation" ? " annotationWin" : "");

    el.style.top = w.y + "px";
    el.style.width = w.w + "px";
    el.style.height = w.h + "px";

    var head = document.createElement("div");

      '<button class="winBtn close" title="Minimize to dock (can reopen later)">&#10005;</button>' +
      '<button class="winBtn deleteForever" title="Delete this window forever">&#128465;</button>';
    el.appendChild(head);

    var body = document.createElement("div");
    body.className = "winBody";
    body.appendChild(buildBody(w));
    el.appendChild(body);

    var rh = document.createElement("div");
    rh.className = "resizeHandle";
    el.appendChild(rh);

    canvasInner.appendChild(el);

    // interactions
    head.querySelector(".close").onclick = function(){ w.closed = true; saveState(); renderAll(); };
    head.querySelector(".sendAway").onclick = function(){ sendAwayAnim(el, w); };
    head.querySelector(".popout").onclick = function(){ popOutWindow(w); };
    head.querySelector(".deleteForever").onclick = function(){

        if (!ok) return;
        stopTimerInterval(w);
        var idx = state.windows.indexOf(w);
        if (idx !== -1) state.windows.splice(idx, 1);
        saveState();
        renderAll();
      });
    };

    el.addEventListener("mousedown", function(){ bringToFront(w); saveState(); });
    makeDraggable(el, head, w);
    makeResizable(el, rh, w);
  }

  function sendAwayAnim(el, w){
    el.classList.add("sending");
    setTimeout(function(){
      w.sentAway = true;
      saveState();
      renderAll();
    }, 320);
  }

  /* ---------- Drag ---------- */
  function makeDraggable(el, handle, w){
    var startX, startY, origX, origY, dragging=false;

    function pointerDown(e){
      if (e.target.tagName === "BUTTON") return;
      dragging = true;
      el.classList.add("dragging");
      var p = getPoint(e);
      startX = p.x; startY = p.y;
      origX = w.x; origY = w.y;
      bringToFront(w);
      e.preventDefault();
    }
    function pointerMove(e){
      if (!dragging) return;
      var p = getPoint(e);
      var dx = p.x - startX, dy = p.y - startY;
      w.x = Math.max(0, origX + dx);
      w.y = Math.max(0, origY + dy);
      el.style.left = w.x + "px";
      el.style.top = w.y + "px";
      updateCanvasExtent();
    }
    function pointerUp(){
      if (!dragging) return;
      dragging = false;
      el.classList.remove("dragging");
      saveState();
      updateCanvasExtent();
    }
    function getPoint(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    handle.addEventListener("mousedown", pointerDown);
    handle.addEventListener("touchstart", pointerDown, {passive:false});
    document.addEventListener("mousemove", pointerMove);
    document.addEventListener("touchmove", pointerMove, {passive:false});
    document.addEventListener("mouseup", pointerUp);
    document.addEventListener("touchend", pointerUp);
  }

  /* ---------- Resize ---------- */
  function makeResizable(el, handle, w){
    var startX, startY, origW, origH, resizing=false;
    function pointerDown(e){
      resizing = true;
      var p = getPoint(e);
      startX = p.x; startY = p.y;
      origW = w.w; origH = w.h;
      e.stopPropagation();
      e.preventDefault();
    }
    function pointerMove(e){
      if (!resizing) return;
      var p = getPoint(e);
      var dx = p.x - startX, dy = p.y - startY;
      w.w = Math.max(180, origW + dx);
      w.h = Math.max(130, origH + dy);
      el.style.width = w.w + "px";
      el.style.height = w.h + "px";
      updateCanvasExtent();
    }
    function pointerUp(){
      if (!resizing) return;
      resizing = false;
      saveState();
      updateCanvasExtent();
    }
    function getPoint(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    handle.addEventListener("mousedown", pointerDown);
    handle.addEventListener("touchstart", pointerDown, {passive:false});
    document.addEventListener("mousemove", pointerMove);
    document.addEventListener("touchmove", pointerMove, {passive:false});
    document.addEventListener("mouseup", pointerUp);
    document.addEventListener("touchend", pointerUp);
  }

  /* ---------- Pop out to real separate window ---------- */
  function popOutWindow(w){
    var popup = window.open("", "popout_"+w.id, "width="+Math.max(w.w,320)+",height="+Math.max(w.h,240)+",menubar=no,toolbar=no,location=no,status=no");

      "<style>body{margin:0;background:"+themeObj.win+";font-family:-apple-system,sans-serif;color:#24303f;} " +
      ".hdr{background:#e7e2d6;padding:10px 14px;font-weight:700;font-size:14px;border-bottom:1px solid #dcd6c6;} " +
      ".content{padding:16px;font-size:15px;line-height:1.5;white-space:pre-wrap;}" +
      "textarea{width:100%;height:80vh;border:none;padding:14px;font-size:16px;font-family:inherit;box-sizing:border-box;}</style></head><body>" +

  "<div class='hdr'>" + escapeHtml(w.title) + " &mdash; drag this window to your second monitor</div>" +
  "<div class='content' id='c'></div>" +
  "</body></html>"
);
popup.document.close();

RICH TEXT EDITOR (bold/underline/size/color + image paste)
============================================================ */
var URL_MATCH_RE = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi;
var URL_AT_CURSOR_RE = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)$/i;

function urlToHref(url){
  return /^www\./i.test(url) ? "https://" + url : url;
}

function isGifUrl(url){
  return /\.gif(\?[^\s]*)?(#[^\s]*)?$/i.test(url);
}

function normalizeGifUrl(url){
  if (/^https?:\/\/[^\/]*giphy\.com\//i.test(url)){
    return url.replace(/_s(\.gif)(\?[^\s]*)?$/i, "$1$2");
  }
  return url;
}

function linkifyPlainText(text){
  var esc = escapeHtml(text).replace(/\n/g, "<br>");
  return esc.replace(URL_MATCH_RE, function(match){
    var href = urlToHref(match);
    if (isGifUrl(match)) return '<img src="' + normalizeGifUrl(href) + '">';
    return '<a href="' + href + '">' + match + '</a>';
  });
}

function autoLinkifyAtCursor(editable, persist){
  var sel = window.getSelection();
  if (!sel.rangeCount) return;
  var range = sel.getRangeAt(0);
  if (!range.collapsed) return;
  var node = range.startContainer;
  if (node.nodeType !== 3) return;
  if (node.parentNode && node.parentNode.closest && node.parentNode.closest("a")) return;
  var offset = range.startOffset;
  var textBefore = node.textContent.slice(0, offset);
  var m = textBefore.match(URL_AT_CURSOR_RE);
  if (!m) return;
  var url = m[0];
  var startIdx = offset - url.length;
  var beforeText = node.textContent.slice(0, startIdx);
  var afterText = node.textContent.slice(offset);
  var inline;
  if (isGifUrl(url)){
    inline = document.createElement("img");
    inline.src = normalizeGifUrl(urlToHref(url));
  } else {
    inline = document.createElement("a");
    inline.href = urlToHref(url);
    inline.textContent = url;
  }
  var beforeNode = document.createTextNode(beforeText);
  var afterNode = document.createTextNode(afterText);
  var parent = node.parentNode;
  parent.insertBefore(beforeNode, node);
  parent.insertBefore(inline, node);
  parent.insertBefore(afterNode, node);
  parent.removeChild(node);
  var newRange = document.createRange();
  newRange.setStart(afterNode, 0);
  newRange.setEnd(afterNode, 0);
  sel.removeAllRanges();
  sel.addRange(newRange);
  persist();
}

function buildTableHtml(rows, cols){
  var html = '<table><tbody>';
  for (var r=0;r<rows;r++){
    html += "<tr>";
    for (var c=0;c<cols;c++){ html += "<td>&nbsp;</td>"; }
    html += "</tr>";
  }
  html += "</tbody></table><div><br></div>";
  return html;
}
function getSelectedTable(editable){
  var sel = window.getSelection();
  if (!sel.rangeCount) return null;
  var node = sel.getRangeAt(0).startContainer;
  if (node.nodeType === 3) node = node.parentNode;
  while (node && node !== editable){
    if (node.tagName === "TABLE") return node;
    node = node.parentNode;
  }
  return null;
}
function tableAddRow(table){
  var rows = table.rows;
  if (!rows.length) return;
  var cols = rows[0].cells.length;
  var tr = document.createElement("tr");
  for (var c=0;c<cols;c++){
    var td = document.createElement("td");
    td.innerHTML = "&nbsp;";
    tr.appendChild(td);
  }
  (table.tBodies[0] || table).appendChild(tr);
}
function tableRemoveRow(table){
  var rows = table.rows;
  if (rows.length <= 1) return;
  rows[rows.length-1].parentNode.removeChild(rows[rows.length-1]);
}
function tableAddCol(table){
  var rows = table.rows;
  for (var i=0;i<rows.length;i++){
    var td = document.createElement("td");
    td.innerHTML = "&nbsp;";
    rows[i].appendChild(td);
  }
}
function tableRemoveCol(table){
  var rows = table.rows;
  if (!rows.length || rows[0].cells.length <= 1) return;
  for (var i=0;i<rows.length;i++){
    rows[i].deleteCell(rows[i].cells.length-1);
  }
}

function downscalePastedImage(dataUrl, cb){
  var maxDim = 900, quality = 0.82;
  var img = new Image();
  img.onload = function(){
    var w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h){ cb(dataUrl); return; }
    if (w > maxDim || h > maxDim){
      var scale = Math.min(maxDim / w, maxDim / h);
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
    }
    var canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    try {
      cb(canvas.toDataURL("image/jpeg", quality));
    } catch(e){
      cb(dataUrl);
    }
  };
  img.onerror = function(){ cb(dataUrl); };
  img.src = dataUrl;
}

function wrapImageForResize(img){
  if (img.parentNode && img.parentNode.classList && img.parentNode.classList.contains("imgResizeWrap")){
    return img.parentNode;
  }
  var wrapEl = document.createElement("span");
  wrapEl.className = "imgResizeWrap";
  img.parentNode.insertBefore(wrapEl, img);
  wrapEl.appendChild(img);
  var handle = document.createElement("span");
  handle.className = "imgResizeHandle";
  wrapEl.appendChild(handle);
  return wrapEl;
}

wrap.querySelector(".richTableBtn").onclick = function(){

wrap.querySelector(".richRowAddBtn").onclick = function(){ editable.focus(); var t = getSelectedTable(editable); if (!t) return; tableAddRow(t); persist(); };
wrap.querySelector(".richRowDelBtn").onclick = function(){ editable.focus(); var t = getSelectedTable(editable); if (!t) return; tableRemoveRow(t); persist(); };

editable.addEventListener("input", persist);
editable.addEventListener("keydown", function(e){
  if (e.key === " " || e.key === "Enter") autoLinkifyAtCursor(editable, persist);
});
editable.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest("a");
  if (a && editable.contains(a)){
    e.preventDefault();
    window.open(a.href, "_blank", "noopener,noreferrer");
    return;
  }
  if (e.target.classList && e.target.classList.contains("imgResizeHandle")) return;

  var prevSelected = editable.querySelectorAll(".imgResizeWrap.selected");
  for (var pi=0;pi<prevSelected.length;pi++){ prevSelected[pi].classList.remove("selected"); }

  if (e.target.tagName === "IMG"){
    var wrapEl = wrapImageForResize(e.target);
    wrapEl.classList.add("selected");
  }
});
function startImageResize(e, img){
  e.preventDefault();
  e.stopPropagation();
  var startX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  var startWidth = img.getBoundingClientRect().width;
  function onMove(ev){
    var clientX = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
    var dx = clientX - startX;
    var newWidth = Math.max(30, Math.round(startWidth + dx));
    var maxWidth = editable.clientWidth;
    if (maxWidth && newWidth > maxWidth) newWidth = maxWidth;
    img.style.width = newWidth + "px";
    img.style.height = "auto";
  }
  function onUp(){
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.removeEventListener("touchmove", onMove);
    document.removeEventListener("touchend", onUp);
    persist();
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
  document.addEventListener("touchmove", onMove, {passive:false});
  document.addEventListener("touchend", onUp);
}
editable.addEventListener("mousedown", function(e){
  if (e.target.classList && e.target.classList.contains("imgResizeHandle")){
    startImageResize(e, e.target.parentNode.querySelector("img"));
  }
});
editable.addEventListener("touchstart", function(e){
  if (e.target.classList && e.target.classList.contains("imgResizeHandle")){
    startImageResize(e, e.target.parentNode.querySelector("img"));
  }
}, {passive:false});
editable.addEventListener("paste", function(e){
  var cd = e.clipboardData || window.clipboardData;
  var items = cd && cd.items;
  if (items){
    for (var i=0;i<items.length;i++){
      if (items[i].type && items[i].type.indexOf("image") !== -1){
        e.preventDefault();
        var blob = items[i].getAsFile();
        if (!blob) continue;
        var reader = new FileReader();
        reader.onload = function(ev){
          downscalePastedImage(ev.target.result, function(finalDataUrl){
            editable.focus();
            document.execCommand("insertHTML", false, '<img src="' + finalDataUrl + '">');
            persist();
          });
        };
        reader.readAsDataURL(blob);
        return;
      }
    }
  }
  var text = cd && cd.getData ? cd.getData("text/plain") : "";
  if (text && /(https?:\/\/|www\.)/i.test(text)){
    e.preventDefault();
    editable.focus();
    document.execCommand("insertHTML", false, linkifyPlainText(text));
    persist();
    return;
  }
  setTimeout(persist, 0);
});

return wrap;
}

var SPINNER_PALETTE = ["#e74c3c","#e67e22","#f1c40f","#27ae60","#16a085","#2980b9","#8e44ad","#d35400","#2ecc71","#2c3e50","#c0392b","#f39c12"];

function spinnerColorAt(i){
return SPINNER_PALETTE[i % SPINNER_PALETTE.length];
}
function drawWheelOnCanvas(canvas, items){
var ctx = canvas.getContext("2d");
var size = canvas.width;
var cx = size/2, cy = size/2, r = size/2 - 3;
ctx.clearRect(0,0,size,size);
var n = items.length || 1;
var sliceRad = (2*Math.PI)/n;
for (var i=0;i<n;i++){
var start = i*sliceRad - Math.PI/2;
var end = start + sliceRad;
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.arc(cx,cy,r,start,end);
ctx.closePath();
ctx.fillStyle = spinnerColorAt(i);
ctx.fill();
ctx.strokeStyle = "rgba(0,0,0,0.2)";
ctx.lineWidth = 1;
ctx.stroke();
ctx.save();
ctx.translate(cx,cy);
ctx.rotate(start + sliceRad/2);
ctx.textAlign = "right";
ctx.textBaseline = "middle";
ctx.fillStyle = "#fff";
ctx.font = "bold 12px -apple-system, sans-serif";
var label = String(items[i]);
if (label.length > 10) label = label.slice(0,9) + "…";
ctx.fillText(label, r-8, 0);
ctx.restore();
}
ctx.beginPath();
ctx.arc(cx,cy,r,0,Math.PI*2);
ctx.strokeStyle = "rgba(0,0,0,0.25)";
ctx.lineWidth = 2;
ctx.stroke();
}

function fmtTime(s){

}

var timerIntervals = {};

var audioCtx = null;
function getAudioCtx(){
if (!audioCtx){
var AC = window.AudioContext || window.webkitAudioContext;
if (AC) audioCtx = new AC();
}
return audioCtx;
}
function playAlarmSound(){
var ctx = getAudioCtx();
if (!ctx) return;
if (ctx.state === "suspended") ctx.resume();
var now = ctx.currentTime;
var beepTimes = [0, 0.35, 0.7, 1.05, 1.4];
for (var i=0;i<beepTimes.length;i++){
var t0 = now + beepTimes[i];
var osc = ctx.createOscillator();
var gain = ctx.createGain();
osc.type = "square";
osc.frequency.setValueAtTime(880, t0);
gain.gain.setValueAtTime(0, t0);
gain.gain.linearRampToValueAtTime(0.25, t0 + 0.02);
gain.gain.linearRampToValueAtTime(0, t0 + 0.22);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(t0);
osc.stop(t0 + 0.25);
}
}

var now = Date.now();
var dt = (now-last)/1000; last = now;
w.remaining -= dt;
if (w.remaining <= 0){
w.remaining = 0;
stopTimerInterval(w);
w.running = false;
btn.textContent = "Start";
if (!w.alarmPlayed){
w.alarmPlayed = true;
playAlarmSound();
}
}
digits.textContent = fmtTime(w.remaining);
updateTimerVisual(w, digits, btn);
saveState();
}, 250);
}

/* ============================================================
BELL SCHEDULES
============================================================ */
function parseTimeToMinutes(str){
str = String(str).trim().toLowerCase();
var m = str.match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/);
if (!m) return null;
var h = parseInt(m[1],10), min = parseInt(m[2],10), mer = m[3];
if (h > 23 || min > 59) return null;
if (mer === "pm" && h !== 12) h += 12;
else if (mer === "am" && h === 12) h = 0;
else if (!mer){
  if (h >= 1 && h <= 6) h += 12;
}
return h*60 + min;
}
function formatMinutesLabel(mins){
mins = ((mins % 1440) + 1440) % 1440;
var h = Math.floor(mins/60), m = mins%60;
var mer = h >= 12 ? "PM" : "AM";
var h12 = h % 12; if (h12 === 0) h12 = 12;
return h12 + ":" + (m<10?"0"+m:""+m) + " " + mer;
}
function parseScheduleText(text){
var lines = text.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l; });
var periods = [];
for (var i=0;i<lines.length;i++){
  var m = lines[i].match(/^(.+?):\s*([^\-–]+?)\s*[-–]\s*(.+)$/);
  if (!m) continue;
  var start = parseTimeToMinutes(m[2]);
  var end = parseTimeToMinutes(m[3]);
  if (start === null || end === null) continue;
  periods.push({ label: m[1].trim(), start: start, end: end });
}
return periods;
}
function serializeScheduleText(periods){
return (periods||[]).map(function(p){
  return p.label + ": " + formatMinutesLabel(p.start) + " - " + formatMinutesLabel(p.end);
}).join("\n");
}
function getActiveSchedule(){
var key = todayKey();
var overrideId = state.scheduleDateOverrides && state.scheduleDateOverrides[key];
if (overrideId && state.bellSchedules[overrideId]) return state.bellSchedules[overrideId];
var day = new Date().getDay();
var assignedId = state.bellScheduleAssignments && state.bellScheduleAssignments[day];
if (assignedId && state.bellSchedules[assignedId]) return state.bellSchedules[assignedId];
return null;
}
function getCurrentPeriodLabel(){
var sched = getActiveSchedule();
if (!sched || !sched.periods || !sched.periods.length) return null;
var now = new Date();
var mins = now.getHours()*60 + now.getMinutes();
for (var i=0;i<sched.periods.length;i++){
  var p = sched.periods[i];
  if (mins >= p.start && mins < p.end){
    return p.label + ": " + formatMinutesLabel(p.start) + " - " + formatMinutesLabel(p.end);
  }
}
return null;
}

  if (n < 1024) return n + " B";

  return (n/(1024*1024)).toFixed(2) + " MB";
}

    var blank = document.createElement("div");

    calGridEl.appendChild(blank);

  for (var d=1; d<=totalDays; d++){
    (function(d){

      var hasLesson = !!(cur && cur.lessons && cur.lessons[key]);

      cell.type = "button";

Z += 1;
var sizeDefaults = {
  note:{w:260,h:200}, clock:{w:240,h:190}, youtube:{w:340,h:260}, spinner:{w:300,h:430}, exitslip:{w:300,h:320},
  bellwork:{w:480,h:420}, timer:{w:260,h:220}, signin:{w:260,h:260}, answers:{w:300,h:260}, annotation:{w:400,h:300}
};
var sz = sizeDefaults[type] || {w:260,h:200};
var w = { id:id, type:type, title:title, x: 60+Math.random()*80, y: 60+Math.random()*60, w: sz.w, h: sz.h, z: Z, closed:false, sentAway:false };
if (type === "note") w.content = "";
if (type === "youtube") w.url = "";
if (type === "spinner"){ w.mode = "numbers"; w.rangeMin = 1; w.rangeMax = 10; w.namesList = ["Student 1","Student 2","Student 3"]; w.namesListText = "Student 1, Student 2, Student 3"; }
if (type === "exitslip"){ w.question = ""; w.feed = []; }
if (type === "bellwork") w.content = "";
if (type === "timer"){ w.seconds = 600; w.remaining = 600; w.running = false; }
if (type === "signin") w.roster = [];
if (type === "answers") w.feed = [];
if (type === "annotation"){ w.penColor = "#ff0000"; w.strokeWidth = 5; w.eraseMode = false; w.drawingData = ""; }
state.windows.push(w);
saveState();
renderAll();
}

/* handle simple extra types generically inside buildBody via fallback */
var origBuildBody = buildBody;
buildBody = function(w){
if (w.type === "note"){
var wrap = document.createElement("div");
wrap.style.height = "100%";
wrap.appendChild(buildRichEditor(w, "content", "Quick note…"));
return wrap;
}
if (w.type === "clock"){
var wrap2 = document.createElement("div");
wrap2.style.cssText = "height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;";
var d = document.createElement("div");
d.style.cssText = "font-family:'SF Mono',Menlo,monospace;font-size:clamp(28px,10vmin,52px);font-weight:700;color:#1d3d3a;";
var dateEl = document.createElement("div");
dateEl.style.cssText = "font-family:'SF Mono',Menlo,monospace;font-size:clamp(13px,4vmin,20px);font-weight:600;color:#5c6b68;";
var periodEl = document.createElement("div");
periodEl.style.cssText = "font-family:'SF Mono',Menlo,monospace;font-size:clamp(12px,3.4vmin,17px);font-weight:700;color:#1f8f7d;";
wrap2.appendChild(d);
wrap2.appendChild(dateEl);
wrap2.appendChild(periodEl);
function tick(){
var now = new Date();
d.textContent = now.toLocaleTimeString();
dateEl.textContent = (now.getMonth()+1) + "/" + now.getDate() + "/" + String(now.getFullYear()).slice(-2);
periodEl.textContent = getCurrentPeriodLabel() || "";
}
tick();
setInterval(tick, 1000);
return wrap2;
}
return origBuildBody(w);
};

function exportSession(){
var data = JSON.stringify(state, null, 2);
var blob = new Blob([data], {type:"application/json"});
var url = URL.createObjectURL(blob);
var a = document.createElement("a");
var today = new Date();
var fname = "classroom-session-" + today.getFullYear() + "-" + (today.getMonth()+1) + "-" + today.getDate() + ".json";
a.href = url; a.download = fname;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
URL.revokeObjectURL(url);
}

/* ============================================================
STUDENT JOIN FLOW (simulated locally via hash route)
============================================================ */
function initJoinFlowIfNeeded(){
if (location.hash !== "#join") return;
document.body.innerHTML =
'<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#141b26;">' +
'<div style="background:#f7f5f0;padding:24px;border-radius:14px;max-width:320px;width:90%;text-align:center;">' +
'<h2 style="margin:0 0 6px;color:#24303f;">Join Class</h2>' +
'<p style="color:#6b6152;font-size:13px;margin:0 0 16px;">Enter your name to sign in.</p>' +
'<input id="joinName" placeholder="Your name" style="width:100%;padding:10px;border-radius:8px;border:1px solid #c9c2ac;font-size:15px;margin-bottom:10px;box-sizing:border-box;">' +
'<button id="joinBtn" style="width:100%;padding:11px;border:none;border-radius:8px;background:#1f8f7d;color:#fff;font-weight:700;font-size:14px;">Join</button>' +
'<p id="joinMsg" style="color:#1f8f7d;font-size:12px;margin-top:10px;"></p>' +
'</div></div>';
document.getElementById("joinBtn").onclick = function(){
var name = document.getElementById("joinName").value.trim();
if (!name) return;
var st = loadState();
var signinWin = null;
for (var i=0;i<st.windows.length;i++){ if (st.windows[i].type==="signin") signinWin = st.windows[i]; }
if (signinWin){
signinWin.roster = signinWin.roster || [];
signinWin.roster.push(name);
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); } catch(e){}
}
document.getElementById("joinMsg").textContent = "You're signed in, " + name + "! (Note: on separate devices this requires the PeerJS/WiFi sync layer to relay to the teacher's screen live.)";
};
}

/* ============================================================
INIT
============================================================ */
if (location.hash === "#join"){
initJoinFlowIfNeeded();
} else {
renderAll();
window.addEventListener("resize", function(){ /* keep layout as-is; user can drag */ });
}

})();
</script>
