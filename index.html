  function stepBall(b, h){
    const py = b.y, hp = hoop;
    b.vy += G * h; b.x += b.vx * h; b.y += b.vy * h; b.rot += b.vx * h / BR;
    if (b.live && !b.scored && moveT <= 0 && py < hp.y && b.y >= hp.y && b.x > hp.rl && b.x < hp.rr) {
      b.scored = true; b.shot = false; b.ret = true; b.vx *= .3; netT = .5; made++;
      // 2 for a basket, 3 from far away, 5 each once you're on fire (3 in a row), 10 if it bounced off a bird and went in
      const long = Math.abs(b.from - hoopX()) > 110, onFire = streak >= 3;
      let pts = long ? 3 : 2, label = long ? 'THREE!' : pick(['SWISH!', 'BUCKET!', 'NOTHIN NET!']);
      if (onFire) { pts = 5; label = 'ON FIRE!'; }
      if (b.birdHit) { pts = 10; label = 'BIRDIE BANK!'; }
      addScore(pts, hoopX(), hp.y - 12, label);
      streak++;
      if (streak === 3) { popups.push({ x: hoopX(), y: hp.y - 34, text: 'SHOOTING STREAK!', life: 1.4, col: '#f87800' }); sfx.bonus(); }
      left += 3;
      popups.push({ x: W / 2, y: 30, text: '+3 SEC', life: 1, col: '#58f858' });
      sfx.swish();
      moveT = 1;                                                       // the hoop hops to another window
    }
    if (b.live) for (const bd of birds) birdBonk(b, bd);
    for (const px of [hp.rl, hp.rr]) {
      const dx = b.x - px, dy = b.y - hp.y, d = Math.hypot(dx, dy);
      if (d < BR + 1 && d > 0) {
        const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
        b.x = px + nx * (BR + 1); b.y = hp.y + ny * (BR + 1);
        if (vn < 0) { b.vx -= 1.55 * vn * nx; b.vy -= 1.55 * vn * ny; if (rimSnd <= 0) { sfx.rim(); rimSnd = .15; } }
      }
    }
    if (b.y > hp.y - 20 - BR && b.y < hp.y + 6 + BR) {
      if (hp.side > 0 && b.x + BR > hp.bx && b.x < hp.bx + 2 && b.vx > 0) { b.x = hp.bx - BR; b.vx = -b.vx * .55; sfx.board(); }
      if (hp.side < 0 && b.x - BR < hp.bx + 3 && b.x > hp.bx + 1 && b.vx < 0) { b.x = hp.bx + 3 + BR; b.vx = -b.vx * .55; sfx.board(); }
    }
    if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx) * .5; }
    if (b.x > W - BR) { b.x = W - BR; b.vx = -Math.abs(b.vx) * .5; }
    if (b.vy >= 0) for (const q of plats) {
      if (py + BR <= q.y + .5 && b.y + BR >= q.y && b.x > q.x1 && b.x < q.x2) {
        b.y = q.y - BR; b.live = false;
        if (b.shot) {                                                  // landed without going in: a miss ends the streak
          b.shot = false;
          if (streak >= 3) popups.push({ x: p.x, y: p.y - 24, text: 'STREAK OVER', life: 1, col: '#f86060' });
          streak = 0;
        }
        if (b.ret) { b.ret = false; b.vx = (p.x < b.x ? -1 : 1) * rand(40, 60); }   // made balls roll back toward you
        if (b.vy > 25) { sfx.bounce(b.vy / 3000); b.vy = -b.vy * .55; b.vx *= .85; }
        else { b.vy = 0; b.vx *= Math.pow(.35, h); if (Math.abs(b.vx) < 2) b.vx = 0; }
        break;
      }
    }
    b.rest = b.vy === 0 && b.vx === 0 ? b.rest + h : 0;
  }

  function loseHeart(text){
    hearts--;
    popups.push({ x: p.x, y: p.y - 24, text, life: 1, col: '#f86060' });
    if (hearts <= 0 && !api.done) { meter = null; api.clearText = 'OUT OF HEARTS!'; api.done = true; sfx.over(); }
  }

  const api = {
    title: 'HOOPS',
    how: '◀ ▶ run &nbsp; ▲ jump (twice = double jump) &nbsp; hold SPACE, let go to shoot<br>Basket 2 &nbsp; long shot 3 &nbsp; 3 in a row = ON FIRE, 5 each &nbsp; off a bird and in 10<br>Stomp a bird +5. Birds you hit dive-bomb you, and watch out for poop!<br>3 hearts &nbsp; every basket adds 3 seconds',
    status: () => 'TIME ' + fmt(left) + '  BASKETS ' + made + (streak >= 3 ? '  ON FIRE!' : ''),
    clearText: "TIME'S UP!",
    update(dt){
      t += dt; left -= dt; netT = Math.max(0, netT - dt); rimSnd -= dt;
      plats = allPlats();
      stepHero(p, dt, plats, meter && !air());
      if (meter) {
        meter.p += meter.dir * dt / (air() ? .55 : 1.4);
        if (meter.p >= 1) { meter.p = 1; meter.dir = -1; } else if (meter.p <= 0) { meter.p = 0; meter.dir = 1; }
      }
      if (p.ball) {
        const b = p.ball, before = Math.floor(p.dp / Math.PI);
        p.dp += dt * (p.vx ? 9 : 6);
        if (meter || air()) { b.x = p.x + p.face * 2; b.y = p.y - 17; }
        else {
          if (Math.floor(p.dp / Math.PI) !== before) sfx.dribble();
          b.x = p.x + p.face * 6; b.y = p.y - BR - Math.abs(Math.sin(p.dp)) * 8;
          b.rot += dt * p.face * 4;
        }
      } else {
        noBallT += dt;
        if (p.ground) for (const b of balls) {
          if (b.free && !b.live && b.noPick <= 0 && b.vy === 0 && Math.abs(b.x - p.x) < 8 && Math.abs(b.y + BR - p.y) < 4) { grab(b); break; }
        }
        if (!p.ball && noBallT > 3.5) {                                // a ball you can't reach pops back to you
          const b = balls.filter(b => b.free && !b.live).sort((a, c) => c.rest - a.rest)[0];
          if (b) { burst(b.x, b.y, 8, ['#fcfcfc'], 40, 0, .4); grab(b); popups.push({ x: p.x, y: p.y - 22, text: 'NEW BALL', life: .8, col: '#fcfcfc' }); }
        }
      }
      birdT -= dt;
      if (birdT <= 0) { spawnBird(); birdT = rand(6, 10); }
      for (const bd of birds) {
        bd.f += dt * (bd.mode === 'fly' ? 7 : 16); bd.hit = Math.max(0, bd.hit - dt); bd.t += dt;
        if (bd.mode === 'fly') {
          bd.x += bd.dir * bd.sp * dt; bd.bob += dt * 3; bd.y = bd.y0 + Math.sin(bd.bob) * 4;
          bd.poopT -= dt;
          const overhead = Math.abs(bd.x - p.x) < 14 && bd.y < p.y - 16;
          if (bd.poopT <= 0 || (overhead && bd.poopT < 2.5)) {          // birds poop now and then, and like to do it right over you
            poops.push({ x: bd.x, y: bd.y + 6, vy: 20 });
            bd.poopT = rand(3, 6);
            tone(300, .08, 'square', .03, -200);
          }
        } else if (bd.mode === 'dive') {                               // steers at the player for a few seconds
          const dx = p.x - bd.x, dy = (p.y - 6) - (bd.y + 3), d = Math.hypot(dx, dy) || 1, sp = 90;
          bd.vx += (dx / d * sp - bd.vx) * dt * 2.5; bd.vy += (dy / d * sp - bd.vy) * dt * 2.5;
          bd.x += bd.vx * dt; bd.y += bd.vy * dt;
          if (Math.abs(bd.vx) > 5) bd.dir = bd.vx > 0 ? 1 : -1;
          if (bd.t > 3) { bd.mode = 'flee'; }
        } else {                                                       // flies up and away
          bd.x += bd.dir * 70 * dt; bd.y -= 60 * dt;
        }
        if (bd.mode === 'flee') continue;
        if (heroHit(p, bd.x, bd.y + 3, 5, 4)) {
          if (p.vy > 0 && p.y - (bd.y + 3) < 4) {                      // landed on top of it
            addScore(5, bd.x, bd.y - 6, 'STOMP!');
            p.vy = -190; p.ground = null; p.air2 = true; p.jumpHeld = true;
            burst(bd.x, bd.y + 3, 12, [bd.k.col, '#fcfcfc'], 60);
            sfx.squish();
            bd.mode = 'flee'; bd.dir = p.x < bd.x ? 1 : -1;
          } else if (bd.mode === 'dive') {
            if (hurtHero(p, bd.x)) loseHeart('OUCH!');
            bd.mode = 'flee';
          }
        }
      }
      birds = birds.filter(bd => bd.x > -20 && bd.x < W + 20 && bd.y > -20);
      for (const pp of poops) {
        const py = pp.y;
        pp.vy = Math.min(160, pp.vy + 260 * dt); pp.y += pp.vy * dt;
        if (Math.abs(pp.x - p.x) < 5 && pp.y > p.y - 13 && pp.y < p.y + 1) {
          pp.gone = true;
          if (hurtHero(p, pp.x)) loseHeart('SPLAT!');
          continue;
        }
        for (const q of plats) if (py <= q.y && pp.y >= q.y && pp.x > q.x1 && pp.x < q.x2) { pp.gone = true; splats.push({ x: pp.x, y: q.y, t: 1.5 }); break; }
        if (pp.y > H) pp.gone = true;
      }
      poops = poops.filter(pp => !pp.gone);
      for (const sp of splats) sp.t -= dt;
      splats = splats.filter(sp => sp.t > 0);
      for (const b of balls) {
        b.noPick = Math.max(0, b.noPick - dt);
        if (b.free) for (let s = 0; s < 3; s++) stepBall(b, dt / 3);
        if (b.live && streak >= 3) parts.push({ x: b.x + rand(-2, 2), y: b.y + rand(-2, 2), vx: rand(-10, 10), vy: rand(-20, 0), g: 0, life: .35, c: pick(['#f83800', '#f87800', '#f8d800']) });
      }
      if (moveT > 0) { moveT -= dt; if (moveT <= 0) placeHoop(); }
      if (left <= 0) { left = 0; meter = null; api.done = true; }
    },
    draw(){
      drawLedges(plats);
      const h = hoop, y = h.y, bx = h.bx;
      ctx.fillStyle = '#000'; ctx.fillRect(bx, y + 6, 4, Math.max(0, h.base - y - 6));
      ctx.fillStyle = '#a4a4b4'; ctx.fillRect(bx + 1, y + 6, 2, Math.max(0, h.base - y - 6));
      ctx.fillStyle = '#000'; ctx.fillRect(bx - 1, y - 21, 5, 28);
      ctx.fillStyle = '#d8b078'; ctx.fillRect(bx, y - 20, 3, 26);
      ctx.fillStyle = '#7c3800'; ctx.fillRect(bx + 1, y - 17, 1, 1); ctx.fillRect(bx + 1, y + 2, 1, 1);
      ctx.strokeStyle = 'rgba(252,252,252,.85)'; ctx.lineWidth = 1;
      const wob = netT > 0 ? Math.sin(netT * 40) * 1.5 : 0, rl = h.rl, rr = h.rr;
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const tx = rl + (rr - rl) * i / 4, bxn = rl + 4 + (rr - rl - 8) * i / 4 + wob;
        ctx.moveTo(tx, y + 1); ctx.lineTo(bxn, y + 11);
      }
      ctx.moveTo(rl + 2 + wob * .5, y + 5); ctx.lineTo(rr - 2 + wob * .5, y + 5);
      ctx.moveTo(rl + 4 + wob, y + 10); ctx.lineTo(rr - 4 + wob, y + 10);
      ctx.stroke();
      ctx.fillStyle = '#000'; ctx.fillRect(Math.round(rl) - 1, y - 1, RIM_W + 3, 4);
      ctx.fillStyle = '#f83800'; ctx.fillRect(Math.round(rl), y, RIM_W + 1, 2);
      for (const bd of birds) {
        const fr = bd.k.fr[Math.floor(bd.f) % 2], img = bd.dir > 0 ? fr.r : fr.l;
        ctx.drawImage(img, Math.round(bd.x - 7), Math.round(bd.y - (img.height > 8 ? 1 : 0)));
      }
      drawHero(p);
      const ox = Math.round(p.x - 4), oy = Math.round(p.y - 12);
      if (meter || (air() && p.ball)) { ctx.fillStyle = PAL.s; ctx.fillRect(ox + 1, oy - 4, 1, 6); ctx.fillRect(ox + 6, oy - 4, 1, 6); }
      if (meter) {
        const mx = ox - 7, my = oy - 18;
        ctx.fillStyle = '#000'; ctx.fillRect(mx - 1, my - 1, 5, 22);
        ctx.fillStyle = '#404040'; ctx.fillRect(mx, my, 3, 20);
        const hgt = Math.round(meter.p * 20);
        ctx.fillStyle = meter.p < .5 ? '#00c800' : meter.p < .8 ? '#f8b800' : '#f83800';
        ctx.fillRect(mx, my + 20 - hgt, 3, hgt);
      }
      for (const b of balls) {
        ctx.save(); ctx.translate(Math.round(b.x), Math.round(b.y));
        ctx.rotate(Math.round(b.rot / (Math.PI / 2)) * Math.PI / 2);
        ctx.drawImage(b.img, -4, -4); ctx.restore();
      }
      for (const pp of poops) {
        const x = Math.round(pp.x), y = Math.round(pp.y);
        ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, 5, 5);
        ctx.fillStyle = '#f8f8f8'; ctx.fillRect(x - 1, y - 1, 3, 3);
        ctx.fillStyle = '#4a3418'; ctx.fillRect(x, y, 1, 1);
      }
      for (const sp of splats) {
        const x = Math.round(sp.x), y = Math.round(sp.y);
        ctx.globalAlpha = Math.min(1, sp.t);
        ctx.fillStyle = '#f8f8f8'; ctx.fillRect(x - 3, y - 1, 7, 1); ctx.fillRect(x - 1, y - 2, 3, 1);
        ctx.fillStyle = '#4a3418'; ctx.fillRect(x, y - 1, 1, 1);
        ctx.globalAlpha = 1;
      }
      for (let i = 0; i < 3; i++) {                                    // hearts, bottom left
        ctx.globalAlpha = i < hearts ? 1 : .25;
        ctx.drawImage(CL_SP.heart, 4 + i * 9, H - 13);
      }
      ctx.globalAlpha = 1;
    },
    press(k){
      heroKey(p, k);
      if (k !== 'Space') return;
      if (!p.ball) { popups.push({ x: p.x, y: p.y - 22, text: 'GET A BALL', life: .8, col: '#fcfcfc' }); return; }
      const dx = hoopX() - p.x;
      if (Math.abs(dx) < 14) { popups.push({ x: p.x, y: p.y - 22, text: 'TOO CLOSE', life: .8, col: '#fcfcfc' }); return; }
      meter = { p: 0, dir: 1 }; p.face = dx > 0 ? 1 : -1;
    },
    release(k){ heroRelease(p, k); if (k === 'Space' && meter) shoot(); }
  };
  return api;
}

/* =====================================================================
   BUG SQUISH — Space Bugs land on your windows; stomp or shoot them
   ===================================================================== */
function SquishGame(){
  let t = 0, left = 60, squished = 0, spawnT = 1, bugs = [], arrows = [], tears = [];
  let plats = getPlats();
  const p = newHero();
  function spawnBug(){
    const look = makeBugLook(Math.floor(Math.random() * 5)), fly = look.type === 2 || look.type === 4;
    const hurry = 1 + (60 - left) / 60;
    bugs.push({ look, fly, x: rand(16, W - 16), y: -10, vy: 0, vx: (Math.random() < .5 ? -1 : 1) * rand(14, 22) * hurry,
      plat: null, t: 0, f: rand(0, 2), mode: fly ? 'enter' : 'fall', hx: rand(20, W - 20), hy: rand(24, H * .45), life: rand(7, 10) });
    sfx.dive();
  }
  function squish(b, pts, label){
    b.dead = true; squished++;
    addScore(pts, b.x, b.y - 6, label);
    burst(b.x, b.y, 14, [b.look.col, shade(b.look.col, .5), '#fcfc78'], 70);
    pts > 25 ? sfx.squish() : sfx.boom();
  }
  const api = {
    title: 'BUG SQUISH',
    how: '◀ ▶ run &nbsp; ▲ jump (again in the air = double jump)<br>Jump on crawling bugs to squish them +50<br>SPACE shoots straight up at flying bugs +25<br>Get them before they chew holes in your windows!',
    status: () => 'TIME ' + fmt(left) + '  SQUISHED ' + squished,
    clearText: "TIME'S UP!",
    update(dt){
      t += dt; left -= dt;
      plats = getPlats();
      stepHero(p, dt, plats, false);
      if (btn.a && p.shootT <= 0) shootArrow(p, arrows, true);
      arrows = stepArrows(arrows, dt);
      spawnT -= dt;
      if (spawnT <= 0 && bugs.length < 10) { spawnBug(); spawnT = Math.max(.6, 1.6 - (60 - left) * .015); }
      for (const b of bugs) {
        b.t += dt; b.f += dt * 7;
        const hw = b.look.w / 2, hh = b.look.h / 2;
        if (b.mode === 'fall') {                                       // floats down until it lands on a ledge
          const py = b.y; b.vy = Math.min(60, b.vy + 120 * dt); b.y += b.vy * dt;
          for (const q of plats) if (py + hh <= q.y + .5 && b.y + hh >= q.y && b.x > q.x1 + 4 && b.x < q.x2 - 4) { b.mode = 'crawl'; b.plat = q.id; b.t = 0; break; }
        } else if (b.mode === 'crawl') {
          const q = plats.find(q => q.id === b.plat);
          if (!q) { b.mode = 'fall'; b.vy = 0; }
          else {
            b.y = q.y - hh; b.x += b.vx * dt;
            if (b.x < q.x1 + hw) { b.x = q.x1 + hw; b.vx = Math.abs(b.vx); }
            if (b.x > q.x2 - hw) { b.x = q.x2 - hw; b.vx = -Math.abs(b.vx); }
            if (!q.floor && b.t > b.life) { b.mode = 'chew'; b.t = 0; b.tear = makeTear(b.x, b.y + 4); tears.push(b.tear); b.mt = 0; sfx.rip(); }
          }
        } else if (b.mode === 'chew') {
          b.tear.k = Math.min(1, b.t / 1.1); b.mt -= dt;
          if (b.mt <= 0) { sfx.munch(); b.mt = .25; }
          if (b.t >= 1.1) { b.mode = 'leave'; b.t = 0; addScore(-25, b.x, b.y, 'CHOMP!'); }
        } else if (b.mode === 'enter') {
          const u = Math.min(1, b.t / 1.2);
          b.y = -10 + (b.hy + 10) * u; b.x += (b.hx - b.x) * Math.min(1, dt * 2);
          if (u >= 1) { b.mode = 'hover'; b.t = 0; }
        } else if (b.mode === 'hover') {                               // wasps and dragonflies hover, then swoop at you
          b.x = b.hx + Math.sin(b.t * 1.5) * 16; b.y = b.hy + Math.sin(b.t * 3) * 4;
          if (b.t > 2.6 && b.t > b.life * .4) { b.mode = 'swoop'; b.t = 0; b.sx = b.x; b.sy = b.y; b.tx = p.x; b.ty = p.y - 6; tone(900, .2, 'triangle', .02, -500); }
        } else if (b.mode === 'swoop') {
          const u = Math.min(1, b.t / 1.3);
          b.x = b.sx + (b.tx - b.sx) * u + Math.sin(u * Math.PI) * 10; b.y = b.sy + (b.ty - b.sy) * Math.sin(u * Math.PI) * 1.15;
          if (u >= 1) { b.mode = 'hover'; b.t = 0; b.hx = clamp(b.x, 20, W - 20); b.hy = b.sy; }
        } else {
          b.y -= 100 * dt; b.x += Math.sin(b.t * 8) * 30 * dt;
          if (b.y < -14) b.dead = true;
        }
        if (b.dead || b.mode === 'leave') continue;
        // arrows only hit flying bugs; crawling ones have to be stomped
        if (b.fly) for (const a of arrows) if (a.life > 0 && Math.abs(a.x - b.x) < hw + 1 && Math.abs(a.y - b.y) < hh + 2) { a.life = 0; squish(b, 25); break; }
        if (b.dead) continue;
        if (heroHit(p, b.x, b.y, hw - 1, hh)) {
          if (p.vy > 0 && p.y - (b.y - hh) < 6) {
            squish(b, 50, 'SQUISH!'); p.vy = -170; p.ground = null; p.air2 = true; p.jumpHeld = true;
          } else if (hurtHero(p, b.x)) addScore(-25, p.x, p.y - 14, 'OUCH!');
        }
      }
      bugs = bugs.filter(b => !b.dead);
      if (left <= 0) { left = 0; api.done = true; }
    },
    draw(){
      drawTears(tears);
      drawLedges(plats);
      for (const b of bugs) {
        const img = b.look.fr[Math.floor(b.f) % 2], jx = b.mode === 'chew' ? Math.round(Math.sin(b.t * 40)) : 0;
        ctx.drawImage(img, Math.round(b.x - img.width / 2) + jx, Math.round(b.y - img.height / 2));
      }
      drawArrows(arrows);
      drawHero(p);
    },
    press(k){ heroKey(p, k); if (k === 'Space') shootArrow(p, arrows, true); },
    release(k){ heroRelease(p, k); }
  };
  return api;
}

/* =====================================================================
   COIN HOP — climb floating platforms to spell the word of the day,
   grab coins for time, and dodge bats, birds, ants and scorpions
   ===================================================================== */
const COIN_SP = (() => {
  const two = (a, b, pal) => [makeSpriteP(a, pal), makeSpriteP(b, pal)].map(c => ({ r: c, l: flip(c) }));
  const antPal = { B: '#b02818', D: '#601008', E: '#fcfcfc' };
  const scPal = { B: '#d8a020', T: '#a87010', P: '#c08818', D: '#604008', E: '#000000', S: '#f83800' };
  return {
    ant: two([".......D.D", ".BB..BB.BB", "BBBBBBBBEB", ".D.D.D....", "D...D...D."],
             [".......D.D", ".BB..BB.BB", "BBBBBBBBEB", "..D.D.D...", ".D..D..D.."], antPal),
    scorpion: two([".ST..........", "T..T.........", "...TT........", "....BBBBB.P.P", "...BBBBBBBPPP", "..BBBBBBBBBE.", ".D.D.D.D.....", "D.D.D.D......"],
                  [".ST..........", "T..T.........", "...TT........", "....BBBBB.P.P", "...BBBBBBBPPP", "..BBBBBBBBBE.", "D.D.D.D......", ".D.D.D.D....."], scPal)
  };
})();
const FLOATER_KINDS = {
  grow:   { top: '#58d830', body: '#2c8c18', dark: '#145010' },
  shrink: { top: '#f8b860', body: '#f87800', dark: '#803800' },
  rise:   { top: '#e080f8', body: '#a040e0', dark: '#502078' },
  ice:    { top: '#ffffff', body: '#9cd8fc', dark: '#3878b8' }
};
function CoinGame(){
  const FLOOR = () => H - 3;
  let t = 0, left = 60, got = 0, hearts = 3, coins = [], bats = [], birds = [], poops = [], splats = [], arrows = [];
  let heart = null, heartT = rand(8, 12), batT = 6, birdT = rand(4, 7), floatT = .3, groundT = 5;
  let floaters = [], floatId = 0, crawlers = [], blobs = [];
  let word = '', li = 0, letter = null, spelled = 0;
  let base = getPlats(), plats = base;
  const p = newHero();

  function addCoins(){
    const ok = base.filter(q => q.x2 - q.x1 >= 24);
    const q = ok.length > 1 && Math.random() < .75 ? pick(ok.filter(q => !q.floor)) : pick(ok);
    const n = 1 + Math.floor(Math.random() * 3), cx = rand(q.x1 + 12, q.x2 - 12), lift = Math.random() < .4 ? rand(10, 26) : 0;
    for (let i = 0; i < n; i++) coins.push({ x: clamp(cx + (i - (n - 1) / 2) * 8, 4, W - 4), y: Math.max(20, q.y - 7 - lift), t: rand(0, 2) });
  }
  // letters always sit high: out of reach of a jump or double jump from the floor
  function placeLetter(){
    if (!word) { letter = null; return; }
    letter = { ch: word[li], x: rand(20, W - 20), y: rand(28, Math.max(30, FLOOR() - 100)), t: 0 };
    burst(letter.x, letter.y, 10, ['#f8d800', '#fcfcfc'], 50);
  }
  // temporary platforms; most of them show up on the way to the next letter
  function spawnFloater(){
    const kind = pick(Object.keys(FLOATER_KINDS)), w = kind === 'grow' ? 12 : kind === 'shrink' ? 44 : rand(26, 38);
    let cx = rand(20, W - 20), y = rand(H * .35, FLOOR() - 36);
    const r = Math.random();
    if (letter && r < .4) { cx = letter.x + rand(-30, 30); y = letter.y + rand(24, 38); }
    else if (letter && r < .7) { cx = letter.x + rand(-60, 60); y = (letter.y + FLOOR()) / 2 + rand(-10, 10); }
    cx = clamp(cx, w / 2 + 2, W - w / 2 - 2);
    const life = rand(5.5, 7);
    floaters.push({ id: 'float' + (floatId++), kind, cx, w, y: Math.round(y), life, max: life, ice: kind === 'ice' });
  }
  function spawnCrawler(){
    const scorp = t > 18 && Math.random() < .4, dir = Math.random() < .5 ? 1 : -1;
    crawlers.push({ kind: scorp ? 'scorpion' : 'ant', x: dir > 0 ? -8 : W + 8, dir, sp: scorp ? 12 : rand(26, 34), f: 0, shootT: rand(2, 4) });
  }
  function loseHeart(text){
    hearts--;
    popups.push({ x: p.x, y: p.y - 24, text, life: 1, col: '#f86060' });
    if (hearts <= 0 && !api.done) { api.clearText = 'OUT OF HEARTS!'; api.done = true; sfx.over(); }
  }
  function hit(x, text){ if (hurtHero(p, x)) loseHeart(text); }
  function stomp(x, y, pts, label, cols){
    addScore(pts, x, y - 6, label);
    p.vy = -190; p.ground = null; p.air2 = true; p.jumpHeld = true;
    burst(x, y, 12, cols, 60); sfx.squish();
  }
  const landing = (x, top) => p.vy > 0 && p.y - top < 5;

  const api = {
    title: 'COIN HOP',
    wordEntry: true,
    how: '◀ ▶ run &nbsp; ▲ jump (twice = double jump) &nbsp; SPACE shoot (hold ▲ to shoot up)<br>Ride the floating platforms up to grab the letters of the word in order!<br>Coins +10 and +1 sec. Stomp or shoot bats, ants and scorpions.<br>Shoot a bird and it attacks: stomp it for +50. Watch out for poop and poison! 3 hearts',
    setWord(wd){ word = wd; li = 0; placeLetter(); },
    status: () => 'TIME ' + fmt(left) + '  COINS ' + got + (word ? '  ' + word.slice(0, li) + '_'.repeat(word.length - li) : ''),
    clearText: "TIME'S UP!",
    update(dt){
      t += dt; left -= dt;
      // floating platforms grow, shrink, rise or stay put (ice), then vanish
      floatT -= dt;
      if (floatT <= 0 && floaters.length < 8) { spawnFloater(); floatT = rand(.9, 1.5); }
      for (const f of floaters) {
        f.life -= dt;
        if (f.kind === 'grow') f.w = Math.min(48, f.w + 8 * dt);
        if (f.kind === 'shrink') f.w = Math.max(6, f.w - 6 * dt);
        if (f.kind === 'rise') f.y = Math.max(20, f.y - 10 * dt);
      }
      floaters = floaters.filter(f => f.life > 0);
      base = getPlats();
      plats = base.concat(floaters.map(f => ({ x1: f.cx - f.w / 2, x2: f.cx + f.w / 2, y: f.y, id: f.id, ice: f.ice })));
      stepHero(p, dt, plats, false);
      if (btn.a && p.shootT <= 0) shootArrow(p, arrows);
      arrows = stepArrows(arrows, dt);

      while (coins.length < 8) addCoins();
      for (const c of coins) {
        c.t += dt;
        if (Math.abs(c.x - p.x) < 6 && Math.abs(c.y - (p.y - 6)) < 9) { c.got = true; got++; addScore(10); left += 1; sfx.coin(); }
      }
      coins = coins.filter(c => !c.got);

      if (letter) {
        letter.t += dt;
        if (Math.abs(letter.x - p.x) < 8 && Math.abs(letter.y - (p.y - 6)) < 10) {
          addScore(25, letter.x, letter.y - 8, letter.ch + '!');
          burst(letter.x, letter.y, 16, ['#f8d800', '#fcfcfc', '#f87800'], 70); sfx.clean();
          li++;
          if (li >= word.length) {                                     // spelled it: bonus, then spell it again
            spelled++; left += 10;
            addScore(200, W / 2, H / 2, word + '!');
            popups.push({ x: W / 2, y: H / 2 + 16, text: '+10 SEC', life: 1.4, col: '#58f858' });
            sfx.bonus(); li = 0;
          }
          placeLetter();
        }
      }

      heartT -= dt;
      if (!heart && heartT <= 0) { const q = pick(base); heart = { x: rand(q.x1 + 8, q.x2 - 8), y: Math.max(20, q.y - 9), life: 5 }; }
      if (heart) {
        heart.life -= dt;
        if (Math.abs(heart.x - p.x) < 6 && Math.abs(heart.y - (p.y - 6)) < 9) {
          if (hearts < 3) { hearts++; popups.push({ x: heart.x, y: heart.y - 8, text: '+HEART', life: 1, col: '#f86060' }); }
          else addScore(50, heart.x, heart.y - 6, 'BONUS!');
          sfx.clean(); heart = null; heartT = rand(9, 13);
        } else if (heart.life <= 0) { heart = null; heartT = rand(9, 13); }
      }

      // bats: hover, swoop at you; stomp or shoot them
      batT -= dt;
      if (batT <= 0 && bats.length < 1 + Math.floor(t / 20)) {
        bats.push({ x: rand(20, W - 20), y: -8, hx: rand(20, W - 20), hy: rand(24, H * .5), t: 0, f: 0, mode: 'enter' });
        batT = rand(4, 7);
      }
      for (const b of bats) {
        b.t += dt; b.f += dt * 6;
        if (b.mode === 'enter') { b.y += 50 * dt; b.x += (b.hx - b.x) * Math.min(1, dt * 2); if (b.y >= b.hy) { b.mode = 'hover'; b.t = 0; } }
        else if (b.mode === 'hover') {
          b.x = b.hx + Math.sin(b.t * 1.5) * 14; b.y = b.hy + Math.sin(b.t * 3) * 4;
          if (b.t > 2.5 && Math.abs(p.x - b.x) < 140) { b.mode = 'swoop'; b.t = 0; b.sx = b.x; b.sy = b.y; b.tx = p.x; b.ty = p.y - 6; tone(900, .2, 'triangle', .02, -500); }
        } else {
          const u = Math.min(1, b.t / 1.3);
          b.x = b.sx + (b.tx - b.sx) * u + Math.sin(u * Math.PI) * 10; b.y = b.sy + (b.ty - b.sy) * Math.sin(u * Math.PI) * 1.15;
          if (u >= 1) { b.mode = 'hover'; b.t = 0; b.hx = clamp(b.x, 20, W - 20); b.hy = b.sy; }
        }
        for (const a of arrows) if (a.life > 0 && Math.abs(a.x - b.x) < 6 && Math.abs(a.y - b.y) < 5) {
          a.life = 0; b.dead = true; addScore(25, b.x, b.y - 6); burst(b.x, b.y, 12, ['#8060d8', '#fcfcfc'], 60); sfx.boom();
        }
        if (!b.dead && heroHit(p, b.x, b.y, 4, 3)) {
          if (landing(b.x, b.y - 3)) { b.dead = true; stomp(b.x, b.y, 25, 'STOMP!', ['#8060d8', '#fcfcfc']); }
          else hit(b.x, 'OUCH!');
        }
      }
      bats = bats.filter(b => !b.dead);

      // birds fly over and poop; shoot one and it attacks, and only then can you stomp it
      birdT -= dt;
      if (birdT <= 0) {
        const k = pick(HOOP_BIRDS), dir = Math.random() < .5 ? 1 : -1;
        birds.push({ k, dir, x: dir > 0 ? -14 : W + 14, y0: rand(18, H * .45), y: 0, sp: rand(32, 50), f: rand(0, 2), bob: rand(0, 6.28), mode: 'fly', t: 0, vx: 0, vy: 0, poopT: rand(1.5, 4) });
        sfx.tweet(); birdT = rand(5, 9);
      }
      for (const bd of birds) {
        bd.f += dt * (bd.mode === 'fly' ? 7 : 16); bd.t += dt;
        if (bd.mode === 'fly') {
          bd.x += bd.dir * bd.sp * dt; bd.bob += dt * 3; bd.y = bd.y0 + Math.sin(bd.bob) * 4;
          bd.poopT -= dt;
          if (bd.poopT <= 0 || (Math.abs(bd.x - p.x) < 14 && bd.y < p.y - 16 && bd.poopT < 2.5)) {
            poops.push({ x: bd.x, y: bd.y + 6, vy: 20 }); bd.poopT = rand(3, 6); tone(300, .08, 'square', .03, -200);
          }
          for (const a of arrows) if (a.life > 0 && Math.abs(a.x - bd.x) < 7 && Math.abs(a.y - (bd.y + 3)) < 5) {
            a.life = 0; bd.mode = 'dive'; bd.t = 0; bd.vx = bd.dir * bd.sp; bd.vy = 0;
            popups.push({ x: bd.x, y: bd.y - 6, text: 'SQUAWK!', life: .9, col: '#f86060' }); tone(900, .3, 'triangle', .04, -600);
          }
        } else if (bd.mode === 'dive') {
          const dx = p.x - bd.x, dy = (p.y - 6) - (bd.y + 3), d = Math.hypot(dx, dy) || 1, sp = 90;
          bd.vx += (dx / d * sp - bd.vx) * dt * 2.5; bd.vy += (dy / d * sp - bd.vy) * dt * 2.5;
          bd.x += bd.vx * dt; bd.y += bd.vy * dt;
          if (Math.abs(bd.vx) > 5) bd.dir = bd.vx > 0 ? 1 : -1;
          if (bd.t > 3) bd.mode = 'flee';
          if (heroHit(p, bd.x, bd.y + 3, 5, 4)) {
            if (landing(bd.x, bd.y + 3)) { stomp(bd.x, bd.y + 3, 50, 'STOMP!', [bd.k.col, '#fcfcfc']); bd.dead = true; }
            else { hit(bd.x, 'OUCH!'); bd.mode = 'flee'; }
          }
        } else { bd.x += bd.dir * 70 * dt; bd.y -= 60 * dt; }
      }
      birds = birds.filter(bd => !bd.dead && bd.x > -20 && bd.x < W + 20 && bd.y > -20);
      for (const pp of poops) {
        const py = pp.y;
        pp.vy = Math.min(160, pp.vy + 260 * dt); pp.y += pp.vy * dt;
        if (Math.abs(pp.x - p.x) < 5 && pp.y > p.y - 13 && pp.y < p.y + 1) { pp.gone = true; hit(pp.x, 'SPLAT!'); continue; }
        for (const q of plats) if (py <= q.y && pp.y >= q.y && pp.x > q.x1 && pp.x < q.x2) { pp.gone = true; splats.push({ x: pp.x, y: q.y, t: 1.5 }); break; }
        if (pp.y > H) pp.gone = true;
      }
      poops = poops.filter(pp => !pp.gone);
      for (const sp of splats) sp.t -= dt;
      splats = splats.filter(sp => sp.t > 0);

      // ants and scorpions pile up along the floor; scorpions spit slow poison
      groundT -= dt;
      if (groundT <= 0 && crawlers.length < 2 + Math.floor(t / 15)) { spawnCrawler(); groundT = rand(4, 7); }
      for (const c of crawlers) {
        const img = COIN_SP[c.kind][0].r, hw = img.width / 2, hgt = img.height, cy = FLOOR() - hgt / 2;
        c.f += dt * (c.kind === 'ant' ? 10 : 5);
        c.x += c.dir * c.sp * dt;
        if (c.x < hw) { c.x = hw; c.dir = 1; } else if (c.x > W - hw) { c.x = W - hw; c.dir = -1; }
        if (c.kind === 'scorpion') {
          c.shootT -= dt;
          if (c.shootT <= 0 && Math.abs(p.x - c.x) < 170) {
            const dx = p.x - c.x, dy = (p.y - 6) - (cy - 2), d = Math.hypot(dx, dy) || 1;
            blobs.push({ x: c.x + c.dir * 4, y: cy - 2, vx: dx / d * 28, vy: dy / d * 28, life: 7 });
            c.shootT = rand(3, 5); tone(180, .15, 'square', .03, -60);
          }
        }
        for (const a of arrows) if (a.life > 0 && Math.abs(a.x - c.x) < hw + 1 && Math.abs(a.y - cy) < hgt / 2 + 2) {
          a.life = 0; c.dead = true;
          addScore(c.kind === 'ant' ? 15 : 30, c.x, cy - 8); burst(c.x, cy, 10, c.kind === 'ant' ? ['#b02818', '#fcfcfc'] : ['#d8a020', '#fcfcfc'], 50); sfx.boom();
        }
        if (!c.dead && heroHit(p, c.x, cy, hw - 1, hgt / 2)) {
          if (landing(c.x, cy - hgt / 2)) { c.dead = true; stomp(c.x, cy, c.kind === 'ant' ? 15 : 30, 'STOMP!', c.kind === 'ant' ? ['#b02818', '#fcfcfc'] : ['#d8a020', '#fcfcfc']); }
          else hit(c.x, 'OUCH!');
        }
      }
      crawlers = crawlers.filter(c => !c.dead);
      for (const b of blobs) {
        b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
        if (Math.abs(b.x - p.x) < 5 && b.y > p.y - 13 && b.y < p.y + 1) { b.life = 0; hit(b.x, 'POISON!'); }
      }
      blobs = blobs.filter(b => b.life > 0 && b.x > -6 && b.x < W + 6 && b.y > -6 && b.y < H + 6);

      if (left <= 0) { left = 0; api.done = true; }
    },
    draw(){
      drawLedges(base);
      for (const f of floaters) {
        if (f.life < 1.5 && Math.floor(f.life * 8) % 2) continue;     // blinks before it disappears
        const c = FLOATER_KINDS[f.kind], x = Math.round(f.cx - f.w / 2), w = Math.max(2, Math.round(f.w)), y = Math.round(f.y);
        ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, w + 2, 6);
        ctx.fillStyle = c.body; ctx.fillRect(x, y, w, 4);
        ctx.fillStyle = c.top; ctx.fillRect(x, y, w, 1);
        ctx.fillStyle = c.dark;
        if (f.kind === 'rise') for (let i = x + 3; i < x + w - 2; i += 6) { ctx.fillRect(i, y + 2, 1, 1); ctx.fillRect(i - 1, y + 3, 3, 1); }
        else if (f.kind === 'ice') { ctx.fillStyle = '#ffffff'; for (let i = x + 2; i < x + w - 2; i += 7) ctx.fillRect(i, y + 1, 2, 1); }
        else for (let i = x + 3; i < x + w - 1; i += 8) ctx.fillRect(i, y + 2, 1, 2);
      }
      for (const c of coins) { const img = CL_SP.coin[Math.floor(c.t * 4) % 2]; ctx.drawImage(img, Math.round(c.x - img.width / 2), Math.round(c.y - 2)); }
      if (heart && !(heart.life < 1.5 && Math.floor(heart.life * 8) % 2)) ctx.drawImage(CL_SP.heart, Math.round(heart.x - 3), Math.round(heart.y - 2 + Math.sin(t * 4)));
      if (letter) {
        const x = Math.round(letter.x), y = Math.round(letter.y + Math.sin(letter.t * 3) * 2);
        ctx.fillStyle = '#000'; ctx.fillRect(x - 8, y - 8, 17, 17);
        ctx.fillStyle = Math.floor(letter.t * 4) % 2 ? '#f8d800' : '#f8b800'; ctx.fillRect(x - 7, y - 7, 15, 15);
        txt(letter.ch, x + 1, y + 1, '#d82800', 8);
      }
      for (const c of crawlers) {
        const fr = COIN_SP[c.kind][Math.floor(c.f) % 2], img = c.dir > 0 ? fr.r : fr.l;
        ctx.drawImage(img, Math.round(c.x - img.width / 2), Math.round(FLOOR() - img.height));
      }
      for (const b of blobs) {
        const x = Math.round(b.x), y = Math.round(b.y);
        ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, 5, 5);
        ctx.fillStyle = Math.floor(b.life * 6) % 2 ? '#58d830' : '#a8f048'; ctx.fillRect(x - 1, y - 1, 3, 3);
      }
      for (const b of bats) { const fr = CL_SP.bat[Math.floor(b.f) % 2]; ctx.drawImage(fr.l, Math.round(b.x - 5), Math.round(b.y - 3)); }
      for (const bd of birds) {
        const fr = bd.k.fr[Math.floor(bd.f) % 2], img = bd.dir > 0 ? fr.r : fr.l;
        ctx.drawImage(img, Math.round(bd.x - 7), Math.round(bd.y - (img.height > 8 ? 1 : 0)));
      }
      for (const pp of poops) {
        const x = Math.round(pp.x), y = Math.round(pp.y);
        ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, 5, 5);
        ctx.fillStyle = '#f8f8f8'; ctx.fillRect(x - 1, y - 1, 3, 3);
        ctx.fillStyle = '#4a3418'; ctx.fillRect(x, y, 1, 1);
      }
      for (const sp of splats) {
        const x = Math.round(sp.x), y = Math.round(sp.y);
        ctx.globalAlpha = Math.min(1, sp.t);
        ctx.fillStyle = '#f8f8f8'; ctx.fillRect(x - 3, y - 1, 7, 1); ctx.fillRect(x - 1, y - 2, 3, 1);
        ctx.globalAlpha = 1;
      }
      drawArrows(arrows);
      drawHero(p);
      for (let i = 0; i < 3; i++) { ctx.globalAlpha = i < hearts ? 1 : .25; ctx.drawImage(CL_SP.heart, 4 + i * 9, H - 13); }
      ctx.globalAlpha = 1;
    },
    press(k){ heroKey(p, k); if (k === 'Space') shootArrow(p, arrows); },
    release(k){ heroRelease(p, k); }
  };
  return api;
}

/* =====================================================================
   SPACE BUGS — the Clean Screen game, played see-through in its window
   (waves of 5, 10 and 15 bugs, then a boss bug, then a bonus round)
   ===================================================================== */
function drawShip(x, y, t){
  ctx.drawImage(SP.ship, x, y);
  if (Math.floor(t * 20) % 2) { ctx.fillStyle = '#f87800'; ctx.fillRect(x + 4, y + 7, 1, 2); ctx.fillStyle = '#f8d800'; ctx.fillRect(x + 3, y + 7, 3, 1); }
}
function BugsGame(){
  const SHIP_Y = H - 10, WAVES = [5, 10, 15];
  let cycle = 0, sf = 1 + (level - 1) * .15;
  const maxOn = () => Math.min(8, [3, 4, 5][wave] + level - 1 + cycle);
  const DIVES = ['swoop', 'zigzag', 'loop', 'dash', 'spiral'];
  const SHOTS = ['single', 'double', 'aimed', 'spread', 'bomb'];
  const BOSS_ATTACKS = ['spread', 'laser', 'homing', 'rain', 'spawn'];
  let freeLives = 0, t = 0, phase, wave, waveKills, banner, bannerT, lives = 3, totalKills, inv = 0, deadT = 0;
  let spawnT, fireT = 0, shots, ebul, bugs, tears, boss, bonus = null, results = null;
  const ship = { x: 128 };

  function restart(){
    wave = 0; cycle = 0; totalKills = 0; freeLives = 0; lives = 3; shots = []; ebul = []; bugs = []; tears = []; boss = null;
    startWave();
  }
  function startWave(){
    waveKills = 0; spawnT = 1.6; ebul = []; results = null;
    say(wave < WAVES.length ? 'WAVE ' + (cycle * 3 + wave + 1) : 'BOSS BUG!', 1.8);
    phase = wave < WAVES.length ? 'wave' : 'boss';
    if (phase === 'boss') makeBoss();
  }
  function say(s, d){ banner = s; bannerT = d; }

  /* ---- bugs ---- */
  function spawn(minion, at){
    const look = minion || makeBugLook(Math.floor(Math.random() * 5));
    const sx = at ? at.x : rand(10, W - 10), sy = at ? at.y : -10;
    const b = { look, x: sx, y: sy, ph: 'enter', t: 0, sx, sy, hx: rand(20, W - 20), hy: rand(16, 46), dur: rand(.8, 1.3), f: rand(0, 2), swing: rand(-25, 25),
      dive: pick(DIVES), shot: pick(SHOTS), fireT: rand(1, 2.5) / sf, minion: !!minion };
    if (minion) startDive(b);
    bugs.push(b);
  }
  function bez(p, u){
    const v = 1 - u, a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
    return [a * p[0][0] + b * p[1][0] + c * p[2][0] + d * p[3][0], a * p[0][1] + b * p[1][1] + c * p[2][1] + d * p[3][1]];
  }
  function startDive(b){
    b.ph = 'dive'; b.t = 0; b.D = rand(1.8, 2.8) / sf; b.sx = b.x; b.sy = b.y; b.shotInDive = false;
    const atShip = b.dive === 'dash' || Math.random() < .35;
    b.tx = atShip ? clamp(ship.x, 12, W - 12) : rand(16, W - 16); b.ty = atShip ? SHIP_Y - 4 : rand(52, SHIP_Y - 16);
    b.path = [[b.x, b.y], [rand(0, W), rand(b.y, b.ty + 20)], [rand(0, W), rand(b.y, b.ty + 20)], [b.tx, b.ty]];
    b.k = 2 + Math.floor(Math.random() * 3); b.A = rand(25, 45); b.dirS = Math.random() < .5 ? 1 : -1;
    sfx.dive();
  }
  function divePos(b, u){
    const lx = b.sx + (b.tx - b.sx) * u, ly = b.sy + (b.ty - b.sy) * u;
    switch (b.dive) {
      case 'swoop': return bez(b.path, u);
      case 'zigzag': return [clamp(lx + Math.sin(u * Math.PI * b.k) * b.A * (1 - u * .7), 6, W - 6), ly];
      case 'loop': {
        if (u < .4) { const a = u / .4 * 6.28, R = 18; return [b.sx + Math.sin(a) * R * b.dirS, b.sy + R - Math.cos(a) * R]; }
        const v = (u - .4) / .6, e = v * v;
        return [b.sx + (b.tx - b.sx) * e, b.sy + (b.ty - b.sy) * e];
      }
      case 'dash': {
        if (u < .35) return [b.sx + Math.sin(u * 90) * 1.5, b.sy - u * 12];     // wind up and shake
        const v = (u - .35) / .65, e = v * v * v;
        return [b.sx + (b.tx - b.sx) * e, b.sy - 4.2 + (b.ty - b.sy + 4.2) * e];
      }
      default: { const a = u * 6.28 * 2.5 * b.dirS, r = (1 - u) * 22; return [lx + Math.cos(a) * r, ly + Math.sin(a) * r * .6]; }
    }
  }
  function bugFire(b){

      for (const s of shots) ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 4);
      if (deadT <= 0 && phase !== 'over' && !(inv > 0 && Math.floor(t * 12) % 2)) drawShip(Math.round(ship.x - 4), SHIP_Y - 4, t);
      if (bannerT > 0 && state === 'play') txt(banner, W / 2, H / 2 - 6, phase === 'over' ? '#f86060' : '#fcfc78', 12);
      if (phase === 'over' && bannerT > 0 && bannerT < 1.6) txt('TRY AGAIN!', W / 2, H / 2 + 10, '#fcfcfc');
    },
    padA: 'Space',
    press(k){ if (k === 'Space') fire(); }
  };
  return api;
}

/* ================= RUNNER: title card -> play -> results, like Clean Screen ================= */
const GAME_MAKERS = { hoops: HoopsGame, squish: SquishGame, coins: CoinGame, bugs: BugsGame };

function start(o){
  soundOn = o.sound !== false;
  volume = clamp(o.volume || 7, 1, 10);
  topsFn = o.tops || null;
  level = 1;
  for (const k in keys) keys[k] = false;
  btn.a = btn.b = false;
  if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});

  const box = document.createElement('div');
  box.className = 'raStage' + (o.inWindow ? ' raInWin' : '');
  box.innerHTML = '<canvas class="raCanvas"></canvas>' +
    '<div class="raHud"><span class="raScore"></span><span class="raEsc">ESC = QUIT</span><span class="raStatus"></span></div>' +
    '<div class="raPanel"></div>';
  o.mount.appendChild(box);
  stageBox = box;
  const cv = box.querySelector('canvas'), panel = box.querySelector('.raPanel');
  const hudScore = box.querySelector('.raScore'), hudStatus = box.querySelector('.raStatus');
  const cssW = box.clientWidth || 320, cssH = box.clientHeight || 180;
  if (o.inWindow) { W = 256; H = Math.max(144, Math.round(256 * cssH / cssW)); }
  else { const S = clamp(Math.round(cssW / 320), 2, 5); W = Math.round(cssW / S); H = Math.round(cssH / S); }
  cv.width = W; cv.height = H;
  ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  let game = null, introT = 0, clearT = 0, raf = 0, stopped = false, last = performance.now();
  let panelBtns = [], panelIdx = 0, lastScore = -1, lastStatus = null;

  function showPanel(html, acts){
    panel.innerHTML = html; panel.classList.remove('hide');
    panelBtns = [...panel.querySelectorAll('button')];
    panelBtns.forEach(b => b.onclick = () => { ac(); const f = acts[b.dataset.act]; if (f) f(); });
    panelIdx = 0; markSel();
  }
  function markSel(){ panelBtns.forEach((b, i) => b.classList.toggle('sel', i === panelIdx)); }
  function hidePanel(){ panel.classList.add('hide'); panelBtns = []; }

  function intro(){
    parts = []; popups = []; score = 0;
    game = GAME_MAKERS[o.gameId]();
    state = 'intro'; introT = game.wordEntry ? Infinity : 4;          // no countdown while someone is typing a word
    const wordBox = game.wordEntry ? `<p class="how">WORD OF THE DAY</p>
      <input class="raWord" maxlength="12" autocomplete="off" spellcheck="false" placeholder="TYPE A WORD" value="${(o.getWord ? o.getWord() : '').replace(/[^A-Z]/g, '')}">` : '';
    showPanel(`<h1>${game.title}</h1><p class="how">${game.how}</p>${wordBox}
      <button data-act="go">GO!${game.wordEntry ? '' : ' <span class="raCd">4</span>'}</button>
      <p class="tip">${game.wordEntry ? 'ENTER = GO' : 'SPACE = GO'} &nbsp; ESC = BACK TO THE MENU</p>`, { go: begin });
    const inp = panel.querySelector('.raWord');
    if (inp) {
      inp.oninput = () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g, ''); };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); begin(); } };
      setTimeout(() => inp.focus(), 0);
    }
  }
  function begin(){
    if (state !== 'intro') return;
    const inp = panel.querySelector('.raWord');
    if (inp) {
      const wd = inp.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 12);
      inp.blur();
      if (o.setWord) o.setWord(wd);
      game.setWord(wd);
    }
    state = 'play'; hidePanel();
  }
  function finish(){
    const best0 = o.best(), isBest = o.save(score) && score > 0;
    state = 'done';
    showPanel(`<h1>${isBest ? 'NEW BEST!' : 'NICE!'}</h1><p>SCORE ${score}</p><p class="how">BEST ${Math.max(best0, score)}</p>
      <div class="row"><button data-act="again">AGAIN</button><button class="sm" data-act="menu">MENU</button></div>`,
      { again: intro, menu: o.quit });
    if (isBest) sfx.bonus();
    if (o.finished) o.finished();
  }

  function frame(now){
    if (stopped) return;
    if (!box.isConnected) { if (o.gone) o.gone(); return; }
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!(o.paused && o.paused())) pollPad();
    if (state === 'play') {
      game.update(dt); stepFx(dt);
      if (game.done) { state = 'clear'; clearT = 1.8; }
    } else if (state === 'clear') {
      stepFx(dt); clearT -= dt;
      if (clearT <= 0) finish();
    } else if (state === 'intro') {
      const before = Math.ceil(introT);
      introT -= dt;
      const cd = panel.querySelector('.raCd');
      if (cd && Math.ceil(introT) !== before) cd.textContent = Math.max(0, Math.ceil(introT));
      if (introT <= 0) begin();
    }
    ctx.clearRect(0, 0, W, H);
    // a light tint keeps the window see-through but makes white sprites readable over white windows
    if (o.inWindow) { ctx.fillStyle = 'rgba(10,14,20,.28)'; ctx.fillRect(0, 0, W, H); }
    if (game && state !== 'intro') game.draw();
    for (const p of parts) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
    for (const p of popups) txt(p.text, clamp(p.x, 34, W - 34), p.y, p.col);
    if (state === 'clear') txt(game.clearText || 'COMPLETE!', W / 2, H / 2 - 8, '#fcfc78', 12);
    if (score !== lastScore) { hudScore.textContent = 'SCORE ' + score; lastScore = score; }
    const s = game && state !== 'intro' ? game.status() : '';
    if (s !== lastStatus) { hudStatus.textContent = s; lastStatus = s; }
    raf = requestAnimationFrame(frame);
  }

  // Bluetooth / USB controller (Gamepad API, standard mapping), fed in as the same keys as the keyboard
  let padPrev = {}, aMap = null, padPrimed = false;
  function pollPad(){
    const list = navigator.getGamepads ? navigator.getGamepads() : [];
    let g = null; for (const x of list) if (x && x.connected !== false) { g = x; break; }
    const now = {};
    if (g) {
      const b = i => !!(g.buttons[i] && g.buttons[i].pressed);
      const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
      now.ArrowLeft = b(14) || ax < -.5; now.ArrowRight = b(15) || ax > .5;
      now.ArrowUp = b(12) || ay < -.5; now.ArrowDown = b(13) || ay > .5;
      now.Space = b(1) || b(2);
      now.Enter = b(9);
      now.Select = b(8);
      // A jumps (fires in Space Bugs) during play, and picks the highlighted button on a title or results screen
      if (b(0) && !aMap) aMap = panelBtns.length ? 'Enter' : (game && game.padA) || 'ArrowUp';
      if (!b(0)) aMap = null;
      if (aMap) now[aMap] = true;
    }
    if (!padPrimed) {                                   // buttons already held when the game opened (like the A that launched it) don't count
      padPrimed = true; padPrev = now;
      if (aMap) aMap = 'Held';
      return;
    }
    for (const k of new Set(Object.keys(now).concat(Object.keys(padPrev)))) {
      const on = !!now[k];
      if (on === !!padPrev[k]) continue;
      if (k === 'Held') continue;
      if (k === 'Select') { if (on) o.quit(); continue; }
      key(k, on);
    }
    padPrev = now;
  }

  function key(k, down){
    keys[k] = down;
    if (k === 'Space') btn.a = down;
    if (!down) { if (state === 'play' && game.release) game.release(k); return; }
    ac();
    if (!panel.classList.contains('hide') && panelBtns.length) {
      if (k === 'ArrowLeft' || k === 'ArrowUp') { panelIdx = (panelIdx - 1 + panelBtns.length) % panelBtns.length; markSel(); sfx.tick(); }
      else if (k === 'ArrowRight' || k === 'ArrowDown') { panelIdx = (panelIdx + 1) % panelBtns.length; markSel(); sfx.tick(); }
      else if (k === 'Space' || k === 'Enter') panelBtns[panelIdx].click();
      return;
    }
    if (state === 'play' && game.press) game.press(k);
  }

  intro();
  raf = requestAnimationFrame(frame);
  return {
    box,
    key,
    stop(){
      stopped = true;
      cancelAnimationFrame(raf);
      if ((state === 'play' || state === 'clear') && score > 0) o.save(score);
      if (box.parentNode) box.parentNode.removeChild(box);
      if (stageBox === box) stageBox = null;
    }
  };
}

return { start };
})();

/* ============================================================
CHECKS FOR UNDERSTANDING — multiple-choice pop-ups timed to the bell schedule
============================================================ */
var CFU_EXAMPLE = "Question: What is 2 + 2?\nA: 1, B: 2, C: 3, D: 4, Answer: D\n\nQuestion: Which planet is closest to the Sun?\nA: Venus, B: Mercury, C: Earth, D: Mars, Answer: B";
var CFU_AI_PROMPT = "Write 20 multiple-choice questions about [TOPIC] for [GRADE LEVEL] students.\n" +
  "Use exactly this format for every question, with a blank line between questions and nothing else before or after:\n\n" +
  "Question: What is 2 + 2?\nA: 1, B: 2, C: 3, D: 4, Answer: D\n\n" +
  "Rules: give 4 choices labeled A to D; don't use \"A:\", \"B:\", \"C:\" or \"D:\" inside a choice's text; mix up which letter is correct.";
var CFU_START_DELAY = 2;   // minutes after the bell for the start-of-class questions
var CFU_END_BEFORE = 3;    // minutes before the bell for the end-of-class questions
var CFU_GRACE = 3;         // a pop-up that's this many minutes late is skipped instead of shown

function defaultCfu(){
  return { enabled: true, counts: { start: 2, middle: 2, end: 2 }, numbers: false, order: "random", shuffle: true,
    banks: [], periodBanks: {}, progress: {}, done: {} };
}

// Reads "Question: ... A: x, B: y, C: z, D: w, Answer: D" blocks. Also accepts "A)" / "A." labels,
// one choice per line, "Q1." style question labels and 2 to 5 choices.
function parseCfuQuestions(text){
  var questions = [], problems = [];
  var blocks = String(text || "").replace(/\r/g, "").split(/\n(?=\s*(?:question|q)\s*\d*\s*[:.)\-]\s)/i);
  for (var i=0;i<blocks.length;i++){
    var raw = blocks[i].trim();
    if (!raw) continue;
    var body = raw.replace(/^\s*(?:question|q)\s*\d*\s*[:.)\-]\s*/i, "");
    var ans = body.match(/(?:^|[\s,;])(?:correct\s+)?answer\s*[:.\-]?\s*([A-E])\b/i);
    if (ans) body = body.slice(0, ans.index);
    var re = /(^|[\s,;])([A-E])\s*[:.)]\s+/g, marks = [], m;
    while ((m = re.exec(body))) marks.push({ letter: m[2], at: m.index + m[1].length, textAt: re.lastIndex });
    // choices must run A, B, C... in order; anything else is part of the question or a choice's text
    var seq = [];
    for (var k=0;k<marks.length;k++){ if (marks[k].letter.charCodeAt(0) - 65 === seq.length) seq.push(marks[k]); }
    var label = raw.split("\n")[0].slice(0, 60);
    if (!ans || seq.length < 2){ problems.push(label); continue; }
    var q = body.slice(0, seq[0].at).replace(/\s+/g, " ").trim();
    var choices = [];
    for (var c=0;c<seq.length;c++){
      var end = c + 1 < seq.length ? seq[c+1].at : body.length;
      choices.push(body.slice(seq[c].textAt, end).replace(/\s+/g, " ").replace(/[\s,;]+$/, "").trim());
    }
    var answer = ans[1].toUpperCase().charCodeAt(0) - 65;
    if (!q || answer >= choices.length || choices.some(function(x){ return !x; })){ problems.push(label); continue; }
    questions.push({ q: q, choices: choices, answer: answer });
  }
  return { questions: questions, problems: problems };
}

function cfuBank(id){
  var banks = state.cfu.banks;
  for (var i=0;i<banks.length;i++){ if (banks[i].id === id) return banks[i]; }
  return null;
}

// every period label across all bell schedules, in bell order, skipping lunch
function cfuPeriodLabels(){
  var seen = {}, list = [];
  for (var id in state.bellSchedules){
    var ps = state.bellSchedules[id].periods || [];
    for (var i=0;i<ps.length;i++){
      var l = ps[i].label;
      if (!seen[l] && !/lunch/i.test(l)){ seen[l] = true; list.push(l); }
    }
  }
  return list;
}

// same "random" spread every time the page loads on a given day, so middle pop-ups don't move around
function cfuSeeded(str){
  var h = 2166136261;
  for (var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){ h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}

// today's pop-up times for one period: [{ key, at (minutes), count, part }]
function cfuSlots(p){
  var c = state.cfu.counts, slots = [], len = p.end - p.start;
  if (c.start > 0) slots.push({ key: "start", at: p.start + CFU_START_DELAY, count: c.start, part: "Start of class" });
  if (c.end > 0 && len > 15) slots.push({ key: "end", at: p.end - CFU_END_BEFORE, count: c.end, part: "End of class" });
  var from = p.start + 12, to = p.end - 6, n = c.middle;
  if (n > 0 && to - from >= 5){
    // split the middle into n equal stretches and pick a random minute in each, so they're spread out
    var rnd = cfuSeeded(todayKey() + "|" + p.label), span = (to - from) / n;
    for (var i=0;i<n;i++){
      var at = Math.round(from + span * i + rnd() * Math.max(0, span - 5));
      slots.push({ key: "mid" + i, at: at, count: 1, part: "Middle of class" });
    }
  }
  return slots;
}

function cfuNextQuestions(label, bankId, count){
  var bank = cfuBank(bankId);
  if (!bank || !bank.questions.length) return [];
  var pkey = label + "|" + bankId;
  var prog = state.cfu.progress[pkey] || (state.cfu.progress[pkey] = { pos: 0, bag: [] });
  var out = [];
  for (var i=0;i<count;i++){
    var idx;
    if (state.cfu.order === "inorder"){ idx = prog.pos % bank.questions.length; prog.pos = idx + 1; }
    else {
      prog.bag = (prog.bag || []).filter(function(n){ return n < bank.questions.length; });
      if (!prog.bag.length){ for (var n=0;n<bank.questions.length;n++) prog.bag.push(n); }
      idx = prog.bag.splice(Math.floor(Math.random() * prog.bag.length), 1)[0];
    }
    out.push(bank.questions[idx]);
    if (out.length >= bank.questions.length) break;
  }
  saveState();
  return out;
}

var cfuOpen = false;
function cfuCheck(){
  if (!state || !state.cfu || !state.cfu.enabled || cfuOpen || arcadeGame || location.hash === "#join") return;
  var sched = getActiveSchedule();
  if (!sched || !sched.periods) return;
  var now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), today = todayKey();
  for (var dk in state.cfu.done){ if (dk.indexOf(today) !== 0) delete state.cfu.done[dk]; }   // forget earlier days
  for (var i=0;i<sched.periods.length;i++){
    var p = sched.periods[i];
    if (mins < p.start || mins >= p.end || /lunch/i.test(p.label)) continue;
    var bankId = state.cfu.periodBanks[p.label];
    if (!bankId || !cfuBank(bankId)) return;
    var slots = cfuSlots(p);
    for (var s=0;s<slots.length;s++){
      var sl = slots[s], doneKey = todayKey() + "|" + p.label + "|" + sl.key;
      if (state.cfu.done[doneKey] || mins < sl.at) continue;
      state.cfu.done[doneKey] = true;
      if (mins - sl.at > CFU_GRACE){ saveState(); continue; }   // too late to be useful: skip quietly
      var qs = cfuNextQuestions(p.label, bankId, sl.count);
      if (qs.length) showCfuPopup(qs, sl.part + " \u00B7 " + p.label);
      return;
    }
  }
}

function cfuNextUp(){
  var sched = getActiveSchedule();
  if (!sched || !sched.periods) return null;
  var now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), best = null;
  for (var i=0;i<sched.periods.length;i++){
    var p = sched.periods[i];
    if (/lunch/i.test(p.label) || !state.cfu.periodBanks[p.label] || !cfuBank(state.cfu.periodBanks[p.label])) continue;
    var slots = cfuSlots(p);
    for (var s=0;s<slots.length;s++){
      if (slots[s].at < mins || state.cfu.done[todayKey() + "|" + p.label + "|" + slots[s].key]) continue;
      if (!best || slots[s].at < best.at) best = { at: slots[s].at, label: p.label, part: slots[s].part, count: slots[s].count };
    }
  }
  return best;
}

function showCfuPopup(questions, subtitle){
  cfuOpen = true;
  var idx = 0, revealed = false;
  var overlay = document.createElement("div");
  overlay.className = "cfuOverlay";
  var card = document.createElement("div");
  card.className = "cfuCard";
  overlay.appendChild(card);
  document.body.appendChild(overlay);

  function render(){
    var q = questions[idx], order = [];
    for (var i=0;i<q.choices.length;i++) order.push(i);
    if (state.cfu.shuffle){
      for (var j=order.length-1;j>0;j--){ var r = Math.floor(Math.random() * (j + 1)), tmp = order[j]; order[j] = order[r]; order[r] = tmp; }
    }
    revealed = false;
    var html = '<div class="cfuTop"><span>CHECK FOR UNDERSTANDING</span><span>' + escapeHtml(subtitle) +
      (questions.length > 1 ? " \u00B7 " + (idx + 1) + " of " + questions.length : "") + '</span></div>' +
      '<div class="cfuQuestion">' + escapeHtml(q.q) + '</div><div class="cfuChoices">';
    for (var k=0;k<order.length;k++){
      var mark = state.cfu.numbers ? String(k + 1) : String.fromCharCode(65 + k);
      html += '<div class="cfuChoice' + (order[k] === q.answer ? ' correct' : '') + '"><span class="cfuMark">' + mark + '</span><span>' + escapeHtml(q.choices[order[k]]) + '</span></div>';
    }
    html += '</div><div class="cfuBtns">' +
      '<button type="button" class="cfuBtn cfuShow">Show answer</button>' +
      '<button type="button" class="cfuBtn cfuNext">' + (idx + 1 < questions.length ? "Next question \u2192" : "Close") + '</button>' +
      (idx + 1 < questions.length ? '<button type="button" class="cfuBtn cfuSkip">Skip the rest</button>' : '') + '</div>';
    card.innerHTML = html;
    wireButtons();
  }
  function wireButtons(){
    // the teacher can click a choice to mark the class's pick in orange, until the answer is shown
    var choices = card.querySelectorAll(".cfuChoice");
    for (var ci=0;ci<choices.length;ci++){
      choices[ci].onclick = function(){
        if (revealed) return;
        var was = this.classList.contains("picked");
        for (var cj=0;cj<choices.length;cj++) choices[cj].classList.remove("picked");
        if (!was) this.classList.add("picked");
      };
    }
    card.querySelector(".cfuShow").onclick = function(){
      revealed = !revealed;
      card.classList.toggle("revealed", revealed);
      this.textContent = revealed ? "Hide answer" : "Show answer";
    };
    var goNext = function(){
      if (idx + 1 < questions.length){ idx++; card.classList.remove("revealed"); render(); }
      else close();
    };
    card.querySelector(".cfuNext").onclick = function(){ leave(goNext, idx + 1 < questions.length ? "move on to the next question" : "close the question"); };
    var skip = card.querySelector(".cfuSkip");
    if (skip) skip.onclick = function(){ leave(close, "close the question"); };
  }
  // never leave a question without its answer showing: light it up, then ask in the button row (below the choices)
  function leave(go, what){
    if (revealed){ go(); return; }
    revealed = true;
    card.classList.add("revealed");
    var row = card.querySelector(".cfuBtns"), before = row.innerHTML;
    row.classList.add("confirm");
    row.innerHTML = '<span class="cfuAsk">Are you sure you want to ' + what + '?</span>' +
      '<button type="button" class="cfuBtn cfuNo">No</button><button type="button" class="cfuBtn cfuYes">Yes</button>';
    row.querySelector(".cfuYes").onclick = go;
    row.querySelector(".cfuNo").onclick = function(){
      row.classList.remove("confirm");
      row.innerHTML = before;
      wireButtons();
      card.querySelector(".cfuShow").textContent = "Hide answer";
    };
  }
  function close(){
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    cfuOpen = false;
  }
  render();
}

// Asks one question that hasn't come up yet: from the bank for the period happening now,
// or the "anytime" bank outside class time or for a period with no bank.
function cfuAskOne(source){
  if (cfuOpen) return;
  var c = state.cfu, label = null, bank = null;
  var sched = getActiveSchedule(), mins = new Date().getHours() * 60 + new Date().getMinutes();
  if (sched && sched.periods) for (var i=0;i<sched.periods.length;i++){
    var p = sched.periods[i];
    if (mins >= p.start && mins < p.end && !/lunch/i.test(p.label) && cfuBank(c.periodBanks[p.label])){ label = p.label; bank = cfuBank(c.periodBanks[p.label]); }
  }
  if (!bank){ bank = cfuBank(c.anytimeBank) || c.banks.filter(function(b){ return b.questions.length; })[0]; label = "anytime"; }
  if (!bank || !bank.questions.length){ alert("Add a question bank in the Checks for Understanding window first."); return; }
  var qs = cfuNextQuestions(label, bank.id, 1);
  if (qs.length) showCfuPopup(qs, source + " \u00B7 " + (label === "anytime" ? bank.name : label));
}

/* ---------- the setup window ---------- */
function buildCfuBody(w){
  var c = state.cfu;
  var wrap = document.createElement("div");
  wrap.className = "cfuSetup";

  function section(title){
    var sec = document.createElement("div");
    sec.className = "cfuSec";
    sec.innerHTML = '<div class="cfuSecTitle">' + title + '</div>';
    wrap.appendChild(sec);
    return sec;
  }
  function refresh(){ var body = wrap.parentNode; if (!body) return; body.innerHTML = ""; body.appendChild(buildCfuBody(w)); }

  // on/off + what's next
  var top = document.createElement("div");
  top.className = "cfuOnRow";
  var onBtn = document.createElement("button");
  onBtn.type = "button";
  onBtn.className = "cfuToggle" + (c.enabled ? " on" : "");
  onBtn.textContent = c.enabled ? "Pop-ups ON" : "Pop-ups OFF";
  onBtn.onclick = function(){ c.enabled = !c.enabled; saveState(); refresh(); };
  top.appendChild(onBtn);
  var tryBtn = document.createElement("button");
  tryBtn.type = "button";
  tryBtn.className = "cfuSmallBtn";
  tryBtn.textContent = "Try a pop-up now";
  tryBtn.onclick = function(){
    var bank = null, cur = getActiveSchedule(), mins = new Date().getHours() * 60 + new Date().getMinutes();
    if (cur && cur.periods) for (var i=0;i<cur.periods.length;i++){
      var p = cur.periods[i];
      if (mins >= p.start && mins < p.end) bank = cfuBank(c.periodBanks[p.label]);
    }
    bank = bank || c.banks.filter(function(b){ return b.questions.length; })[0];
    if (!bank){ alert("Add a question bank first."); return; }
    var qs = cfuNextQuestions("preview", bank.id, 2);
    showCfuPopup(qs, "Preview \u00B7 " + bank.name);
  };
  top.appendChild(tryBtn);
  wrap.appendChild(top);
  var next = cfuNextUp(), nextEl = document.createElement("div");
  nextEl.className = "cfuNextUp";
  nextEl.textContent = !c.enabled ? "Pop-ups are off." :
    next ? "Next: " + next.label + " at " + formatMinutesLabel(next.at) + " (" + next.part.toLowerCase() + ", " + next.count + (next.count === 1 ? " question)" : " questions)") :
    "No more pop-ups today.";
  wrap.appendChild(nextEl);

  // when + how many
  var when = section("When to ask (number of questions)");
  [["start", "Start of class", "about " + CFU_START_DELAY + " min after the bell"],
   ["middle", "Middle of class", "spread out at random times"],
   ["end", "End of class", CFU_END_BEFORE + " min before the bell"]].forEach(function(def){
    var row = document.createElement("label");
    row.className = "cfuCountRow";
    row.innerHTML = '<input type="number" min="0" max="10" value="' + c.counts[def[0]] + '"><span><b>' + def[1] + '</b> ' + def[2] + '</span>';
    row.querySelector("input").onchange = function(e){
      c.counts[def[0]] = Math.max(0, Math.min(10, parseInt(e.target.value, 10) || 0));
      e.target.value = c.counts[def[0]];
      saveState();
    };
    when.appendChild(row);
  });
  var hint = document.createElement("div");
  hint.className = "cfuHint";
  hint.textContent = "Use 0 to skip that part of class.";
  when.appendChild(hint);

  // options
  var opts = section("Options");
  function check(label, get, set){
    var row = document.createElement("label");
    row.className = "cfuCheckRow";
    row.innerHTML = '<input type="checkbox"' + (get() ? " checked" : "") + '><span>' + label + '</span>';
    row.querySelector("input").onchange = function(e){ set(e.target.checked); saveState(); };
    opts.appendChild(row);
  }
  check("Number the answers 1 2 3 4 (for holding up fingers)", function(){ return c.numbers; }, function(v){ c.numbers = v; });
  check("Shuffle the answer choices", function(){ return c.shuffle; }, function(v){ c.shuffle = v; });
  check("Ask questions in order (unchecked = random)", function(){ return c.order === "inorder"; }, function(v){ c.order = v ? "inorder" : "random"; });

  // banks
  var banksSec = section("Question banks");
  if (!c.banks.length){
    var none = document.createElement("div");
    none.className = "cfuHint";
    none.textContent = "No banks yet. Add one and paste in your questions.";
    banksSec.appendChild(none);
  }
  c.banks.forEach(function(bank){
    var row = document.createElement("div");
    row.className = "cfuBankRow";
    row.innerHTML = '<span class="cfuBankName">' + escapeHtml(bank.name) + '</span><span class="cfuBankCount">' + bank.questions.length + ' questions</span>' +
      '<button type="button" class="cfuSmallBtn cfuEdit">Edit</button><button type="button" class="cfuSmallBtn cfuDel">Delete</button>';
    row.querySelector(".cfuEdit").onclick = function(){ showCfuBankEditor(bank, refresh); };
    row.querySelector(".cfuDel").onclick = function(){
      showConfirm('Delete the question bank "' + bank.name + '"?', function(ok){
        if (!ok) return;
        c.banks.splice(c.banks.indexOf(bank), 1);
        for (var l in c.periodBanks){ if (c.periodBanks[l] === bank.id) delete c.periodBanks[l]; }
        saveState(); refresh();
      });
    };
    banksSec.appendChild(row);
  });
  var addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "cfuSmallBtn cfuAdd";
  addBtn.textContent = "+ New question bank";
  addBtn.onclick = function(){ showCfuBankEditor(null, refresh); };
  banksSec.appendChild(addBtn);

  // which bank each period uses
  var perSec = section("Which bank each period uses");
  var labels = cfuPeriodLabels();
  labels.forEach(function(label){
    var row = document.createElement("label");
    row.className = "cfuPeriodRow";
    var opts2 = '<option value="">No pop-ups</option>';
    c.banks.forEach(function(b){ opts2 += '<option value="' + b.id + '"' + (c.periodBanks[label] === b.id ? " selected" : "") + '>' + escapeHtml(b.name) + '</option>'; });
    row.innerHTML = '<span>' + escapeHtml(label) + '</span><select>' + opts2 + '</select>';
    row.querySelector("select").onchange = function(e){
      if (e.target.value) c.periodBanks[label] = e.target.value; else delete c.periodBanks[label];
      saveState(); refresh();
    };
    perSec.appendChild(row);
  });
  var any = document.createElement("label");
  any.className = "cfuPeriodRow";
  var anyOpts = '<option value="">First bank</option>';
  c.banks.forEach(function(b){ anyOpts += '<option value="' + b.id + '"' + (c.anytimeBank === b.id ? " selected" : "") + '>' + escapeHtml(b.name) + '</option>'; });
  any.innerHTML = '<span>Anytime</span><select>' + anyOpts + '</select>';
  any.querySelector("select").onchange = function(e){ c.anytimeBank = e.target.value || null; saveState(); };
  perSec.appendChild(any);
  var anyHint = document.createElement("div");
  anyHint.className = "cfuHint";
  anyHint.textContent = "Anytime is used outside class time for right-click and after-game questions. Right-click this window's tab in the dock to ask one question.";
  perSec.appendChild(anyHint);
  if (!labels.length){
    var np = document.createElement("div");
    np.className = "cfuHint";
    np.textContent = "Set up a bell schedule in the cog menu first.";
    perSec.appendChild(np);
  }
  return wrap;
}

function showCfuBankEditor(bank, done){
  var overlay = document.createElement("div");
  overlay.className = "modalOverlay";
  var card = document.createElement("div");
  card.className = "modalCard cfuEditor";
  card.innerHTML =
    '<h3>' + (bank ? "Edit question bank" : "New question bank") + '</h3>' +
    '<input class="cfuBankNameInput" placeholder="Bank name, like Unit 2: Weather" value="' + escapeHtml(bank ? bank.name : "") + '">' +
    '<div class="cfuFormat">Paste questions in this format. To make them with AI, click <b>Copy AI prompt</b>, paste it into any AI chat, fill in the topic, then paste what it writes here.</div>' +
    '<textarea class="cfuText" rows="12" placeholder="' + escapeHtml(CFU_EXAMPLE) + '">' + escapeHtml(bank ? bank.text : "") + '</textarea>' +
    '<div class="cfuParseMsg"></div>' +
    '<div class="promptRow"><button class="cancelB cfuCopy">Copy AI prompt</button><button class="cancelB cfuCancel">Cancel</button><button class="okB cfuSave">Save</button></div>';
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  var ta = card.querySelector(".cfuText"), msg = card.querySelector(".cfuParseMsg"), nameIn = card.querySelector(".cfuBankNameInput");
  function check(){
    var r = parseCfuQuestions(ta.value);
    msg.className = "cfuParseMsg" + (r.problems.length ? " warn" : "");
    msg.textContent = !ta.value.trim() ? "" :
      r.questions.length + " questions read." + (r.problems.length ? " Couldn't read " + r.problems.length + ": " + r.problems.slice(0, 3).join(" | ") : "");
    return r;
  }
  ta.oninput = check;
  check();
  (bank ? ta : nameIn).focus();
  function close(){ if (overlay.parentNode) document.body.removeChild(overlay); }
  card.querySelector(".cfuCopy").onclick = function(){
    var btn = this;
    function copied(){ btn.textContent = "Copied!"; setTimeout(function(){ btn.textContent = "Copy AI prompt"; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(CFU_AI_PROMPT).then(copied, function(){ showPrompt("Copy this prompt", CFU_AI_PROMPT, function(){}, true); });
    else showPrompt("Copy this prompt", CFU_AI_PROMPT, function(){}, true);
  };
  card.querySelector(".cfuCancel").onclick = close;
  overlay.onclick = function(e){ if (e.target === overlay) close(); };
  card.querySelector(".cfuSave").onclick = function(){
    var r = check();
    if (!r.questions.length){ msg.className = "cfuParseMsg warn"; msg.textContent = "No questions found. Check the format above."; return; }
    var name = nameIn.value.trim() || "Question bank " + (state.cfu.banks.length + 1);
    if (bank){ bank.name = name; bank.text = ta.value; bank.questions = r.questions; }
    else state.cfu.banks.push({ id: "bank_" + Date.now(), name: name, text: ta.value, questions: r.questions });
    saveState();
    close();
    done();
  };
}

function exportSession(){
var data = JSON.stringify(state, null, 2);
var blob = new Blob([data], {type:"application/json"});
var url = URL.createObjectURL(blob);
var a = document.createElement("a");
var today = new Date();
var fname = "classroom-session-" + today.getFullYear() + "-" + (today.getMonth()+1) + "-" + today.getDate() + ".json";
a.href = url; a.download = fname;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
URL.revokeObjectURL(url);
}
