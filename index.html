<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Classroom Hub</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #141b26;
    color: #eef1f4;
    -webkit-user-select: none; user-select: none;
  }
  #desk {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }

/* ––––– Top marquee bar ––––– */
#topbar {
position: absolute; top: 0; left: 0; right: 0; height: 42px;
background: linear-gradient(180deg,#20293a,#161d29);
border-bottom: 1px solid #2c3a4f;
display: flex; align-items: stretch;
z-index: 500;
}
#marqueeWrap {
flex: 1; position: relative; overflow: hidden;
display: flex; align-items: center;
}
#marqueeTrack {
position: absolute; white-space: nowrap; will-change: transform;
font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
color: #ffd98e;
padding-left: 100%;
}
#marqueeEditBtn {
width: 42px; flex-shrink: 0; border: none; background: transparent; color: #7fa8c9;
font-size: 18px; cursor: pointer; border-left: 1px solid #2c3a4f;
}
#cogBtn {
width: 42px; flex-shrink: 0; border: none; background: transparent; color: #9fb4c7;
font-size: 19px; cursor: pointer; border-left: 1px solid #2c3a4f;
}
#cogBtn:active, #marqueeEditBtn:active { background: #263349; }

/* ––––– Canvas where windows live ––––– */
#canvas {
position: absolute; top: 42px; left: 0; right: 0; bottom: 40px;
overflow: auto;
-webkit-overflow-scrolling: touch;
}
#canvasInner {
position: relative;
min-width: 100%; min-height: 100%;
}

/* ––––– Window ––––– */
.win {
position: absolute;
background: #f7f5f0;
color: #24303f;
border-radius: 10px;
box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.06);
display: flex; flex-direction: column;
overflow: hidden;
min-width: 180px; min-height: 130px;
transition: box-shadow .15s, opacity .35s, transform .35s;
}
.win.dragging { box-shadow: 0 18px 40px rgba(0,0,0,0.5); }
.win.private { box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 2px #e0a640; }
.win.annotationWin {
background: transparent !important;
box-shadow: 0 0 0 1px rgba(255,255,255,0.25), 0 6px 20px rgba(0,0,0,0.25) !important;
flex-direction: column-reverse;
}
.win.annotationWin .winHead {
border-bottom: none;
border-top: 1px solid rgba(255,255,255,0.15);
}
.winHead {
height: 34px; flex-shrink: 0;
background: #e7e2d6;
display: flex; align-items: center;
padding: 0 8px;
cursor: grab;
border-bottom: 1px solid #dcd6c6;
}
.winHead:active { cursor: grabbing; }
.winTitle {
flex: 1; font-size: 13px; font-weight: 700; color: #4a4030;
white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
letter-spacing: 0.2px;
}
.winBtn {
width: 24px; height: 24px; border: none; border-radius: 6px;
background: transparent; color: #6b6152; font-size: 13px; cursor: pointer;
display: flex; align-items: center; justify-content: center; margin-left: 2px;
}
.winBtn:active { background: rgba(0,0,0,0.08); }
.winBtn.close:active { background: #d8564a; color: #fff; }
.winBtn.deleteForever { color: #a3453a; font-size: 12px; }
.winBtn.deleteForever:active { background: #d8564a; color: #fff; }
.winBody { flex: 1; overflow: auto; position: relative; }
.resizeHandle {
position: absolute; right: 0; bottom: 0; width: 22px; height: 22px;
cursor: nwse-resize;
background: linear-gradient(135deg, transparent 50%, #b9b09b 50%);
border-bottom-right-radius: 10px;
}
.privTag {
position: absolute; top: 6px; right: 30px; font-size: 10px; font-weight: 800;
color: #8a5a00; background: #ffe3ad; padding: 2px 6px; border-radius: 5px;
letter-spacing: 0.4px; pointer-events: none;
}
.winHead .privTag { position: static; margin-right: 6px; }

/* window sending animation */
.win.sending {
transform: translateX(140vw) scale(0.85);
opacity: 0;
}
.win.arriving-back {
animation: arriveBack .35s ease-out;
}
@keyframes arriveBack {
from { transform: translateX(60px); opacity: 0; }
to { transform: translateX(0); opacity: 1; }
}

/* ––––– Bellwork window content ––––– */
.bellworkArea {
width: 100%; height: 100%; border: none; resize: none;
padding: 14px 16px; font-size: 16px; line-height: 1.5;
font-family: -apple-system, sans-serif; color: #2b2318;
background: #fffdf7;
}
.bellworkArea:focus { outline: none; background: #fffef9; }

/* ––––– Timer ––––– */
.timerBody {
display: flex; flex-direction: column; align-items: center; justify-content: center;
height: 100%; gap: 10px; padding: 10px;
}
.timerDigits {
font-family: "SF Mono", "Menlo", monospace; font-size: 15vmin; max-font-size: 54px;
font-size: clamp(30px, 12vmin, 60px);
font-weight: 700; color: #1d3d3a; letter-spacing: 1px;
}
.timerDigits.running { color: #1f8f7d; }
.timerDigits.done { color: #c1442e; animation: pulse 0.6s infinite alternate; }
@keyframes pulse { from{opacity:1;} to{opacity:0.4;} }
.timerBtnRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tBtn {
border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700;
background: #dcd6c6; color: #3a3327; cursor: pointer;
}
.tBtn.go { background: #1f8f7d; color: #fff; }
.tBtn:active { filter: brightness(0.92); }
.timeSetRow { display: flex; gap: 6px; align-items: center; }
.timeSetRow input {
width: 70px; border: 1px solid #c9c2ac; border-radius: 6px; padding: 6px 8px; font-size: 13px; text-align: center;
}

/* ––––– YouTube window ––––– */
.ytBody { height: 100%; display: flex; flex-direction: column; }
.ytInputRow { display: flex; gap: 6px; padding: 8px; background: #efeade; border-bottom: 1px solid #dcd6c6; }
.ytInputRow input {
flex: 1; border: 1px solid #c9c2ac; border-radius: 6px; padding: 7px 9px; font-size: 13px;
}
.ytInputRow button {
border: none; border-radius: 6px; padding: 7px 12px; background: #1f8f7d; color: #fff;
font-size: 13px; font-weight: 700; cursor: pointer;
}
.ytFrameWrap { flex: 1; background: #000; position: relative; }
.ytFrameWrap iframe { width: 100%; height: 100%; border: none; }
.ytPlaceholder {
position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
color: #8a8f96; font-size: 13px; text-align: center; padding: 20px; background: #1a1f26;
}

/* ––––– Sign-in / QR window ––––– */
.signBody { padding: 14px; height: 100%; overflow: auto; }
.qrBox {
width: 100%; max-width: 220px; margin: 0 auto 12px; aspect-ratio: 1/1;
background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center;
border: 1px solid #dcd6c6;
}
.qrBox img { width: 100%; height: 100%; border-radius: 6px; }
.joinLine { text-align: center; font-size: 12px; color: #6b6152; margin-bottom: 10px; word-break: break-all; }
.rosterList { list-style: none; margin: 0; padding: 0; }
.rosterList li {
display: flex; align-items: center; gap: 8px;
padding: 7px 8px; border-bottom: 1px solid #ece7d9; font-size: 13px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: #1f8f7d; flex-shrink: 0; }
.rosterEmpty { text-align: center; color: #9a9282; font-size: 12px; padding: 14px; }

/* ––––– Answers window (private) ––––– */
.ansBody { height: 100%; display: flex; flex-direction: column; }
.ansToolbar {
display: flex; gap: 6px; padding: 7px 8px; background: #efeade; border-bottom: 1px solid #dcd6c6;
align-items: center;
}
.ansToolbar input {
flex: 1; border: 1px solid #c9c2ac; border-radius: 6px; padding: 6px 8px; font-size: 12px;
}
.ansToolbar button {
border: none; border-radius: 6px; padding: 6px 10px; background: #6b6152; color: #fff;
font-size: 11px; font-weight: 700; cursor: pointer;
}
.ansFeed { flex: 1; overflow: auto; padding: 8px; font-family: "SF Mono", Menlo, monospace; font-size: 12px; }
.ansItem {
background: #fff; border: 1px solid #e2ddcf; border-radius: 7px; padding: 7px 9px; margin-bottom: 6px;
}
.ansItem .who { font-weight: 700; color: #1f8f7d; }
.ansItem .txt { color: #2b2318; margin-top: 2px; }
.ansEmpty { text-align: center; color: #9a9282; font-size: 12px; padding: 20px; }

/* ––––– Random Spinner window ––––– */
.spinBody { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px; gap: 8px; overflow: auto; }
.spinModeRow { display: flex; gap: 6px; }
.spinModeBtn {
border: 1px solid #c9c2ac; background: #efeade; color: #4a4030; border-radius: 8px;
padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.spinModeBtn.active { background: #1f8f7d; color: #fff; border-color: #1f8f7d; }
.spinRangeRow { width: 100%; display: flex; gap: 8px; align-items: center; justify-content: center; }
.spinRangeRow input {
width: 64px; border: 1px solid #c9c2ac; border-radius: 6px; padding: 6px 8px; font-size: 13px; text-align: center;
}
.spinToLabel { font-size: 12px; font-weight: 700; color: #6b6152; }
.spinListRow { width: 100%; display: flex; gap: 6px; align-items: flex-start; }
.spinListInput {
flex: 1; border: 1px solid #c9c2ac; border-radius: 6px; padding: 6px 8px; font-size: 12px;
font-family: inherit; resize: vertical; min-height: 34px;
}
.spinWheelWrap { position: relative; width: 200px; height: 200px; flex-shrink: 0; }
.spinCanvas { width: 200px; height: 200px; border-radius: 50%; display: block; }
.spinPointer {
position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent;
border-top: 15px solid #c1442e; z-index: 2; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
}
.spinResult { font-size: 15px; font-weight: 800; color: #2b2318; min-height: 20px; text-align: center; }
.spinResult.spinning { color: #8a8f96; font-weight: 600; }
.spinResult.done { color: #1f8f7d; }

/* ––––– Exit Slip window ––––– */
.exitBody { height: 100%; display: flex; flex-direction: column; }
.exitQWrap { padding: 8px; background: #efeade; border-bottom: 1px solid #dcd6c6; }
.exitQLabel { display: block; font-size: 10px; font-weight: 700; color: #6b6152; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }

/* ––––– Transparency Overlay window ––––– */
.annoBody { height: 100%; display: flex; flex-direction: column-reverse; }
.annoToolbar {
display: flex; align-items: center; gap: 6px; padding: 6px 8px; flex-wrap: wrap; flex-shrink: 0;
background: rgba(20,27,38,0.55);
}
.annoColors { display: flex; gap: 4px; }
.annoSwatch {
width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); cursor: pointer; padding: 0;
}
.annoSwatch.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.45); }
.annoWidths { display: flex; gap: 4px; }
.annoWidthBtn, .annoEraseBtn, .annoClearBtn {
border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); color: #fff;
border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 700; cursor: pointer;
}
.annoWidthBtn.active, .annoEraseBtn.active { background: #fff; color: #222; }
.annoCanvasWrap { flex: 1; position: relative; min-height: 0; }
.annoCanvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

/* ––––– Rich text editor (Bellwork, Quick Note, Exit Slip question) ––––– */
.richWrap { height: 100%; display: flex; flex-direction: column; }
.richToolbar {
display: flex; gap: 4px; align-items: center; padding: 6px 8px; background: #efeade;
border-bottom: 1px solid #dcd6c6; flex-shrink: 0; flex-wrap: wrap;
}
.richBtn {
width: 26px; height: 26px; border: 1px solid #c9c2ac; border-radius: 5px; background: #fff;
color: #4a4030; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.richBtn:active { background: #e7e2d6; }
.richSizeSelect {
border: 1px solid #c9c2ac; border-radius: 5px; background: #fff; color: #4a4030;
font-size: 12px; padding: 4px 6px;
}
.richColor { width: 28px; height: 26px; border: 1px solid #c9c2ac; border-radius: 5px; padding: 1px; cursor: pointer; background: #fff; }
.richEditable {
flex: 1; overflow: auto; padding: 14px 16px; font-size: 16px; line-height: 1.5;
font-family: -apple-system, sans-serif; color: #2b2318; background: #fffdf7; outline: none;
}
.richEditable img { max-width: 100%; border-radius: 6px; display: block; margin: 6px 0; }
.imgResizeWrap { position: relative; display: inline-block; max-width: 100%; vertical-align: bottom; }
.imgResizeWrap.selected { outline: 2px solid #1f8f7d; outline-offset: 2px; border-radius: 6px; }
.imgResizeHandle {
display: none; position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px;
background: #1f8f7d; border: 2px solid #fff; border-radius: 4px; cursor: nwse-resize; z-index: 2;
}
.imgResizeWrap.selected .imgResizeHandle { display: block; }
.richEditable a { color: #1f6f9c; text-decoration: underline; cursor: pointer; }
.richEditable table { border-collapse: collapse; margin: 8px 0; }
.richEditable table td, .richEditable table th { border: 1px solid #c9c2ac; padding: 6px 10px; min-width: 40px; }
.richEditable:empty:before { content: attr(data-placeholder); color: #a89f8c; pointer-events: none; }
.animWord { display: inline-block; }
@keyframes animBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.anim-bounce { animation: animBounce 0.9s ease-in-out infinite; }
@keyframes animWiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.anim-wiggle { animation: animWiggle 0.6s ease-in-out infinite; }
@keyframes animPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
.anim-pulse { animation: animPulse 1s ease-in-out infinite; }
@keyframes animShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.anim-shake { animation: animShake 0.5s ease-in-out infinite; }
@keyframes animRainbow { 0% { color: #e6194b; } 16% { color: #f58231; } 33% { color: #ffd700; } 50% { color: #3cb44b; } 66% { color: #4363d8; } 83% { color: #911eb4; } 100% { color: #e6194b; } }
.anim-rainbow { animation: animRainbow 3s linear infinite; }
@keyframes animGlow { 0%,100% { text-shadow: 0 0 2px rgba(31,143,125,0.3); } 50% { text-shadow: 0 0 10px rgba(31,143,125,0.9), 0 0 16px rgba(31,143,125,0.6); } }
.anim-glow { animation: animGlow 1.2s ease-in-out infinite; }
.richBtnWide {
height: 26px; padding: 0 8px; border: 1px solid #c9c2ac; border-radius: 5px; background: #fff;
color: #4a4030; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.richBtnWide:active { background: #e7e2d6; }
.richColorSplit { display: flex; height: 26px; border: 1px solid #c9c2ac; border-radius: 5px; overflow: hidden; background: #fff; }
.richColorApply { width: 26px; border: none; background: #fff; cursor: pointer; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.richColorApply .letter { font-size: 13px; font-weight: 800; color: #4a4030; line-height: 1; }
.richColorApply .bar { width: 16px; height: 4px; border-radius: 2px; margin-top: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,0.2); }
.richColorMore { width: 16px; border: none; border-left: 1px solid #c9c2ac; background: #fff; color: #4a4030; font-size: 9px; cursor: pointer; padding: 0; }
.richColorApply:active, .richColorMore:active { background: #e7e2d6; }
.colorPop {
position: fixed; z-index: 1200; background: #fff; border: 1px solid #c9c2ac; border-radius: 8px;
box-shadow: 0 8px 24px rgba(0,0,0,0.3); padding: 8px; width: 156px;
}
.colorPopGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.colorPopSwatch { width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.25); cursor: pointer; padding: 0; }
.colorPopSwatch.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1f8f7d; }
.colorPopCustom {
display: block; width: 100%; margin-top: 8px; border: 1px solid #c9c2ac; border-radius: 5px; background: #f7f5f0;
color: #4a4030; font-size: 11px; font-weight: 600; padding: 5px; cursor: pointer; text-align: center; position: relative; overflow: hidden;
}
.colorPopCustom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.exitQRich .richToolbar { padding: 4px 6px; }

/* ––––– Checks for Understanding ––––– */
.cfuSetup { padding: 10px 12px; font-family: -apple-system, sans-serif; color: #2b2318; font-size: 13px; }
.cfuOnRow { display: flex; gap: 8px; align-items: center; }
.cfuToggle { border: none; border-radius: 8px; padding: 8px 14px; font-weight: 800; font-size: 13px; cursor: pointer; background: #c9c2ac; color: #4a4030; }
.cfuToggle.on { background: #1f8f7d; color: #fff; }
.cfuSmallBtn { border: 1px solid #c9c2ac; background: #fff; color: #4a4030; border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 600; cursor: pointer; }
.cfuSmallBtn:active { background: #e7e2d6; }
.cfuNextUp { margin-top: 6px; font-size: 12px; color: #6b6152; }
.cfuSec { margin-top: 12px; padding-top: 10px; border-top: 1px solid #dcd6c6; }
.cfuSecTitle { font-size: 10px; font-weight: 800; color: #6b6152; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.cfuCountRow, .cfuCheckRow, .cfuPeriodRow { display: flex; align-items: center; gap: 8px; margin: 5px 0; cursor: pointer; }
.cfuCountRow input { width: 52px; padding: 5px; border: 1px solid #c9c2ac; border-radius: 6px; font-size: 14px; font-weight: 700; text-align: center; }
.cfuCountRow span { color: #6b6152; font-size: 12px; }
.cfuCountRow b { color: #2b2318; font-size: 13px; }
.cfuCheckRow input { width: 16px; height: 16px; }
.cfuPeriodRow span { width: 70px; font-weight: 700; }
.cfuPeriodRow select { flex: 1; padding: 5px; border: 1px solid #c9c2ac; border-radius: 6px; background: #fff; font-size: 12px; }
.cfuHint { font-size: 11px; color: #8a7f6c; }
.cfuBankRow { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #fff; border: 1px solid #dcd6c6; border-radius: 8px; margin-bottom: 5px; }
.cfuBankName { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cfuBankCount { font-size: 11px; color: #8a7f6c; white-space: nowrap; }
.cfuAdd { margin-top: 2px; }
.cfuEditor { max-width: 560px; width: 100%; }
.cfuEditor h3 { margin: 0 0 10px; }
.cfuBankNameInput { width: 100%; border: 1px solid #3a4a63; background: #10161f; color: #e6ebf1; border-radius: 8px; padding: 9px; font-size: 14px; margin-bottom: 8px; }
.cfuFormat { font-size: 12px; color: #8fa3ba; line-height: 1.45; margin-bottom: 8px; }
.cfuFormat b { color: #dce6f0; }
.cfuText { width: 100%; border: 1px solid #3a4a63; background: #10161f; color: #e6ebf1; border-radius: 8px; padding: 9px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; resize: vertical; }
.cfuParseMsg { min-height: 18px; font-size: 12px; color: #7dffb0; margin: 6px 0 10px; }
.cfuParseMsg.warn { color: #ffb37a; }
.cfuOverlay { position: fixed; inset: 0; z-index: 1150; background: rgba(8,12,18,.72); display: flex; align-items: center; justify-content: center; padding: 24px; }
.cfuCard {
width: min(980px, 100%); max-height: 100%; overflow: auto; background: #141b26; color: #f4f6f8; border-radius: 18px;
box-shadow: 0 20px 60px rgba(0,0,0,.6); padding: 28px 36px 24px; font-family: -apple-system, "Segoe UI", sans-serif;
border: 3px solid #1f8f7d;
}
.cfuTop { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #7fd8c6; margin-bottom: 16px; }
.cfuQuestion { font-size: clamp(24px, 3.6vw, 40px); font-weight: 800; line-height: 1.25; margin-bottom: 22px; }
.cfuChoices { display: flex; flex-direction: column; gap: 10px; }
.cfuChoice { display: flex; align-items: center; gap: 16px; font-size: clamp(20px, 2.8vw, 32px); padding: 10px 16px; border-radius: 12px; background: #1d2736; transition: opacity .25s, color .25s; }
.cfuMark { flex-shrink: 0; width: 1.6em; height: 1.6em; border-radius: 50%; background: #2f3d52; display: flex; align-items: center; justify-content: center; font-weight: 900; }
.cfuChoice { cursor: pointer; }
.cfuCard:not(.revealed) .cfuChoice:hover { background: #26324a; }
.cfuCard:not(.revealed) .cfuChoice.picked { background: #3a2410; color: #ffb347; font-weight: 800; box-shadow: 0 0 0 3px #ff8c1a; }
.cfuCard:not(.revealed) .cfuChoice.picked .cfuMark { background: #ff8c1a; color: #141b26; }
.cfuCard.revealed .cfuChoice { opacity: .55; cursor: default; }
.cfuCard.revealed .cfuChoice.correct { opacity: 1; color: #ffe100; font-weight: 900; background: #2a2a10; box-shadow: 0 0 0 3px #ffe100; text-shadow: 0 0 12px rgba(255,225,0,.45); }

  function bringToFront(w){
    Z += 1; w.z = Z;

  function updateCanvasExtent(){
    var maxRight = canvas.clientWidth;
    var maxBottom = canvas.clientHeight;
    for (var i=0;i<state.windows.length;i++){
      var w = state.windows[i];
      if (w.closed || w.sentAway) continue;
      var right = w.x + w.w + 60;
      var bottom = w.y + w.h + 60;
      if (right > maxRight) maxRight = right;
      if (bottom > maxBottom) maxBottom = bottom;
    }
    canvasInner.style.width = maxRight + "px";
    canvasInner.style.height = maxBottom + "px";
  }

    canvasInner.innerHTML = "";

    }
    renderDockAndGhosts();
    updateCanvasExtent();
    applyTheme();

  function renderDockAndGhosts(){
    var anyClosed = false, anySent = false;
    for (var i=0;i<state.windows.length;i++){
      var w = state.windows[i];
      if (w.closed){
        anyClosed = true;
        var chip = document.createElement("div");
        chip.className = "dockChip";
        chip.innerHTML = '<span class="dot2"></span><span>' + escapeHtml(w.title) + '</span>';
        (function(win){ chip.onclick = function(){ win.closed = false; bringToFront(win); saveState(); renderAll(); }; })(w);
        if (w.type === "cfu"){
          chip.title = "Click to open. Right-click to ask one question now.";
          chip.oncontextmenu = function(e){ e.preventDefault(); cfuAskOne("Quick check"); };
        }
        dock.appendChild(chip);

      if (w.sentAway && !w.closed){
        anySent = true;
        var gt = document.createElement("div");
        gt.className = "ghostTab";

  var POINTER_DIRS = [
    { deg: -45, sym: "↖" }, { deg: 0, sym: "↑" }, { deg: 45, sym: "↗" }, { deg: 90, sym: "→" },
    { deg: 135, sym: "↘" }, { deg: 180, sym: "↓" }, { deg: 225, sym: "↙" }, { deg: 270, sym: "←" }
  ];

  var POINTER_BASE = 110; // about 4x a regular mouse cursor

  function getPointerShape(id){
    for (var g=0;g<POINTER_SHAPE_GROUPS.length;g++){
      var items = POINTER_SHAPE_GROUPS[g].items;
      for (var i=0;i<items.length;i++){ if (items[i].id === id) return items[i]; }
    }
    return POINTER_SHAPE_GROUPS[0].items[0];
  }

  function pointerShapeHtml(shape, px){
    if (shape.svg) return POINTER_SVGS[shape.svg];
    return '<span class="ptrEmoji" style="font-size:' + Math.round(px*0.82) + 'px">' + shape.emoji + '</span>';
  }

  function renderPointer(w){
    var shape = getPointerShape(w.shape);
    var size = Math.round(POINTER_BASE * (w.size || 1));
    var dir = (w.dir === undefined) ? -45 : w.dir;
    w.w = size; w.h = size;

    var el = document.createElement("div");
    el.className = "ptrEl" + (w.animate === false ? "" : " animated");
    el.id = "winel_" + w.id;
    el.style.left = w.x + "px";
    el.style.top = w.y + "px";
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.title = "Drag to move. Right-click (or press and hold) for shapes, text, and more.";

    var rot = document.createElement("div");
    rot.className = "ptrRot";
    if (shape.angle !== undefined) rot.style.transform = "rotate(" + (dir - shape.angle) + "deg)";
    var pulse = document.createElement("div");
    pulse.className = "ptrPulse";
    pulse.innerHTML = pointerShapeHtml(shape, size);
    rot.appendChild(pulse);
    el.appendChild(rot);

    if (w.text){
      var bubble = document.createElement("div");
      bubble.className = "ptrBubble";
      bubble.textContent = w.text;
      bubble.style.fontSize = Math.max(14, Math.round(size * 0.24)) + "px";
      el.appendChild(bubble);
      // put the bubble on the side opposite the tip so it never covers what's being pointed at
      var rad = (dir + 180) * Math.PI / 180;
      var ox = Math.sin(rad), oy = -Math.cos(rad);
      var tx = "-50%", ty = "-50%";
      if (ox > 0.3){ bubble.style.left = (size*0.85) + "px"; tx = "0"; }
      else if (ox < -0.3){ bubble.style.left = (size*0.15) + "px"; tx = "-100%"; }
      else bubble.style.left = (size/2) + "px";
      if (oy > 0.3){ bubble.style.top = (size*0.85) + "px"; ty = "0"; }
      else if (oy < -0.3){ bubble.style.top = (size*0.15) + "px"; ty = "-100%"; }
      else bubble.style.top = (size/2) + "px";
      bubble.style.translate = tx + " " + ty;
    }

    canvasInner.appendChild(el);

    var dragging = false, moved = false, startX, startY, origX, origY, holdTimer = null;
    function pt(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    function down(e){
      if (e.button === 2) return;
      var p = pt(e);
      dragging = true; moved = false;
      startX = p.x; startY = p.y; origX = w.x; origY = w.y;
      el.classList.add("dragging");
      clearTimeout(holdTimer);
      // press-and-hold opens the menu on touch screens, which have no right-click
      if (e.touches) holdTimer = setTimeout(function(){
        if (dragging && !moved){ dragging = false; el.classList.remove("dragging"); showPointerMenu(w, startX, startY); }
      }, 650);
      e.preventDefault();
    }
    function move(e){
      if (!dragging) return;
      var p = pt(e);
      var dx = p.x - startX, dy = p.y - startY;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      moved = true;
      clearTimeout(holdTimer);
      w.x = Math.max(0, origX + dx);
      w.y = Math.max(0, origY + dy);
      el.style.left = w.x + "px";
      el.style.top = w.y + "px";
      e.preventDefault();
    }
    function up(){
      clearTimeout(holdTimer);
      if (!dragging) return;
      dragging = false;
      el.classList.remove("dragging");
      document.removeEventListener("mousemove", move);
      document.removeEventListener("touchmove", move);
      document.removeEventListener("mouseup", up);
      document.removeEventListener("touchend", up);
      if (moved){ saveState(); updateCanvasExtent(); }
    }
    function startListening(e){

  /* ---------- Drag ---------- */
  function makeDraggable(el, handle, w){
    var startX, startY, origX, origY, dragging=false;

    function pointerDown(e){
      if (e.target.tagName === "BUTTON") return;
      dragging = true;
      el.classList.add("dragging");
      var p = getPoint(e);
      startX = p.x; startY = p.y;
      origX = w.x; origY = w.y;
      bringToFront(w);
      e.preventDefault();
    }
    function pointerMove(e){
      if (!dragging) return;
      var p = getPoint(e);
      var dx = p.x - startX, dy = p.y - startY;
      w.x = Math.max(0, origX + dx);
      w.y = Math.max(0, origY + dy);
      el.style.left = w.x + "px";
      el.style.top = w.y + "px";
      updateCanvasExtent();
    }
    function pointerUp(){
      if (!dragging) return;
      dragging = false;
      el.classList.remove("dragging");
      saveState();
      updateCanvasExtent();
    }
    function getPoint(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    handle.addEventListener("mousedown", pointerDown);
    handle.addEventListener("touchstart", pointerDown, {passive:false});
    document.addEventListener("mousemove", pointerMove);
    document.addEventListener("touchmove", pointerMove, {passive:false});
    document.addEventListener("mouseup", pointerUp);
    document.addEventListener("touchend", pointerUp);
  }

  /* ---------- Resize ---------- */
  function makeResizable(el, handle, w){
    var startX, startY, origW, origH, resizing=false;
    function pointerDown(e){
      resizing = true;
      var p = getPoint(e);
      startX = p.x; startY = p.y;
      origW = w.w; origH = w.h;
      e.stopPropagation();
      e.preventDefault();
    }
    function pointerMove(e){
      if (!resizing) return;
      var p = getPoint(e);
      var dx = p.x - startX, dy = p.y - startY;
      w.w = Math.max(180, origW + dx);
      w.h = Math.max(130, origH + dy);
      el.style.width = w.w + "px";
      el.style.height = w.h + "px";
      updateCanvasExtent();
    }
    function pointerUp(){
      if (!resizing) return;
      resizing = false;
      saveState();
      updateCanvasExtent();
    }
    function getPoint(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    handle.addEventListener("mousedown", pointerDown);
    handle.addEventListener("touchstart", pointerDown, {passive:false});
    document.addEventListener("mousemove", pointerMove);
    document.addEventListener("touchmove", pointerMove, {passive:false});
    document.addEventListener("mouseup", pointerUp);
    document.addEventListener("touchend", pointerUp);
  }

var URL_MATCH_RE = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi;
var URL_AT_CURSOR_RE = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)$/i;

function urlToHref(url){
  return /^www\./i.test(url) ? "https://" + url : url;
}

function isGifUrl(url){
  return /\.gif(\?[^\s]*)?(#[^\s]*)?$/i.test(url);
}

function normalizeGifUrl(url){
  if (/^https?:\/\/[^\/]*giphy\.com\//i.test(url)){
    return url.replace(/_s(\.gif)(\?[^\s]*)?$/i, "$1$2");
  }
  return url;
}

function linkifyPlainText(text){
  var esc = escapeHtml(text).replace(/\n/g, "<br>");
  return esc.replace(URL_MATCH_RE, function(match){
    var href = urlToHref(match);
    if (isGifUrl(match)) return '<img src="' + normalizeGifUrl(href) + '">';
    return '<a href="' + href + '">' + match + '</a>';
  });
}

function autoLinkifyAtCursor(editable, persist){
  var sel = window.getSelection();
  if (!sel.rangeCount) return;
  var range = sel.getRangeAt(0);
  if (!range.collapsed) return;
  var node = range.startContainer;
  if (node.nodeType !== 3) return;
  if (node.parentNode && node.parentNode.closest && node.parentNode.closest("a")) return;
  var offset = range.startOffset;
  var textBefore = node.textContent.slice(0, offset);
  var m = textBefore.match(URL_AT_CURSOR_RE);
  if (!m) return;
  var url = m[0];
  var startIdx = offset - url.length;
  var beforeText = node.textContent.slice(0, startIdx);
  var afterText = node.textContent.slice(offset);
  var inline;
  if (isGifUrl(url)){
    inline = document.createElement("img");
    inline.src = normalizeGifUrl(urlToHref(url));
  } else {
    inline = document.createElement("a");
    inline.href = urlToHref(url);
    inline.textContent = url;
  }
  var beforeNode = document.createTextNode(beforeText);
  var afterNode = document.createTextNode(afterText);
  var parent = node.parentNode;
  parent.insertBefore(beforeNode, node);
  parent.insertBefore(inline, node);
  parent.insertBefore(afterNode, node);
  parent.removeChild(node);
  var newRange = document.createRange();
  newRange.setStart(afterNode, 0);
  newRange.setEnd(afterNode, 0);
  sel.removeAllRanges();
  sel.addRange(newRange);
  persist();
}

function buildTableHtml(rows, cols){

  return html;
}
function getSelectedTable(editable){

    if (node.tagName === "TABLE") return node;
    node = node.parentNode;
  }

}

function downscalePastedImage(dataUrl, cb){
  var maxDim = 900, quality = 0.82;
  var img = new Image();
  img.onload = function(){
    var w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h){ cb(dataUrl); return; }
    if (w > maxDim || h > maxDim){
      var scale = Math.min(maxDim / w, maxDim / h);
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
    }
    var canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    try {
      cb(canvas.toDataURL("image/jpeg", quality));
    } catch(e){
      cb(dataUrl);
    }
  };
  img.onerror = function(){ cb(dataUrl); };
  img.src = dataUrl;
}

function wrapImageForResize(img){
  if (img.parentNode && img.parentNode.classList && img.parentNode.classList.contains("imgResizeWrap")){
    return img.parentNode;
  }
  var wrapEl = document.createElement("span");
  wrapEl.className = "imgResizeWrap";
  img.parentNode.insertBefore(wrapEl, img);
  wrapEl.appendChild(img);
  var handle = document.createElement("span");
  handle.className = "imgResizeHandle";
  wrapEl.appendChild(handle);
  return wrapEl;
}

var ANIM_WORD_CLASSES = ["anim-bounce","anim-wiggle","anim-pulse","anim-shake","anim-rainbow","anim-glow"];
function toggleAnimateSelection(editable){
  var sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  var range = sel.getRangeAt(0);

  var container = range.commonAncestorContainer;
  var node = container.nodeType === 3 ? container.parentNode : container;
  var existing = node.closest ? node.closest(".animWord") : null;
  if (existing && editable.contains(existing)){
    var textNode = document.createTextNode(existing.textContent);
    existing.parentNode.replaceChild(textNode, existing);
    var restoreRange = document.createRange();
    restoreRange.selectNodeContents(textNode);
    sel.removeAllRanges();
    sel.addRange(restoreRange);
    return;
  }

  var span = document.createElement("span");
  span.className = "animWord " + ANIM_WORD_CLASSES[Math.floor(Math.random()*ANIM_WORD_CLASSES.length)];
  try {
    range.surroundContents(span);
  } catch(e){
    var content = range.extractContents();
    span.appendChild(content);
    range.insertNode(span);
  }
  var newRange = document.createRange();
  newRange.selectNodeContents(span);
  sel.removeAllRanges();
  sel.addRange(newRange);
}

});
editable.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest("a");
  if (a && editable.contains(a)){
    e.preventDefault();
    window.open(a.href, "_blank", "noopener,noreferrer");
    return;
  }
  if (e.target.classList && e.target.classList.contains("imgResizeHandle")) return;

  var prevSelected = editable.querySelectorAll(".imgResizeWrap.selected");
  for (var pi=0;pi<prevSelected.length;pi++){ prevSelected[pi].classList.remove("selected"); }

  if (e.target.tagName === "IMG"){
    var wrapEl = wrapImageForResize(e.target);
    wrapEl.classList.add("selected");
  }
});
function startImageResize(e, img){
  e.preventDefault();
  e.stopPropagation();
  var startX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  var startWidth = img.getBoundingClientRect().width;
  function onMove(ev){
    var clientX = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
    var dx = clientX - startX;
    var newWidth = Math.max(30, Math.round(startWidth + dx));
    var maxWidth = editable.clientWidth;
    if (maxWidth && newWidth > maxWidth) newWidth = maxWidth;
    img.style.width = newWidth + "px";
    img.style.height = "auto";
  }
  function onUp(){
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.removeEventListener("touchmove", onMove);
    document.removeEventListener("touchend", onUp);
    persist();
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
  document.addEventListener("touchmove", onMove, {passive:false});
  document.addEventListener("touchend", onUp);
}
editable.addEventListener("mousedown", function(e){
  if (e.target.classList && e.target.classList.contains("imgResizeHandle")){
    startImageResize(e, e.target.parentNode.querySelector("img"));
  }
});
editable.addEventListener("touchstart", function(e){
  if (e.target.classList && e.target.classList.contains("imgResizeHandle")){
    startImageResize(e, e.target.parentNode.querySelector("img"));
  }
}, {passive:false});
editable.addEventListener("paste", function(e){
  var cd = e.clipboardData || window.clipboardData;
  var items = cd && cd.items;
  if (items){
    for (var i=0;i<items.length;i++){
      if (items[i].type && items[i].type.indexOf("image") !== -1){
        e.preventDefault();
        var blob = items[i].getAsFile();
        if (!blob) continue;
        var reader = new FileReader();
        reader.onload = function(ev){
          downscalePastedImage(ev.target.result, function(finalDataUrl){
            editable.focus();
            document.execCommand("insertHTML", false, '<img src="' + finalDataUrl + '">');
            persist();
          });
        };
        reader.readAsDataURL(blob);
        return;
      }
    }
  }
  var text = cd && cd.getData ? cd.getData("text/plain") : "";
  if (text && /(https?:\/\/|www\.)/i.test(text)){
    e.preventDefault();
    editable.focus();
    document.execCommand("insertHTML", false, linkifyPlainText(text));
    persist();
    return;
  }
  setTimeout(persist, 0);
});

return wrap;
}

  var annoDrawing = false, annoLastPt = null;

  function annoGetPoint(e){

    if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };

    var scaleX = annoCanvas.width / rect.width;
    var scaleY = annoCanvas.height / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }
  function annoStart(e){
    e.preventDefault();
    annoDrawing = true;
    var p = annoGetPoint(e);
    annoLastPt = annoToCanvasPoint(p.x, p.y);
  }
  function annoMove(e){
    if (!annoDrawing) return;
    e.preventDefault();
    var p = annoGetPoint(e);
    var pt = annoToCanvasPoint(p.x, p.y);
    annoCtx.globalCompositeOperation = w.eraseMode ? "destination-out" : "source-over";
    annoCtx.strokeStyle = w.penColor;
    annoCtx.lineWidth = w.eraseMode ? ANNO_ERASER_WIDTH : w.strokeWidth;
    annoCtx.lineCap = "round";
    annoCtx.lineJoin = "round";
    annoCtx.beginPath();
    annoCtx.moveTo(annoLastPt.x, annoLastPt.y);
    annoCtx.lineTo(pt.x, pt.y);
    annoCtx.stroke();
    annoLastPt = pt;
  }
  function annoEnd(){
    if (!annoDrawing) return;
    annoDrawing = false;
    annoLastPt = null;
    w.drawingData = annoCanvas.toDataURL();
    saveState();
  }
  annoCanvas.addEventListener("mousedown", annoStart);
  annoCanvas.addEventListener("mousemove", annoMove);
  annoCanvas.addEventListener("mouseup", annoEnd);
  annoCanvas.addEventListener("mouseleave", annoEnd);
  annoCanvas.addEventListener("touchstart", annoStart, {passive:false});
  annoCanvas.addEventListener("touchmove", annoMove, {passive:false});
  annoCanvas.addEventListener("touchend", annoEnd);
  annoCanvas.addEventListener("touchcancel", annoEnd);
}

return wrap;

}

function rangeToItems(min, max){

function spinnerColorAt(i){
return SPINNER_PALETTE[i % SPINNER_PALETTE.length];

function drawWheelOnCanvas(canvas, items){
var ctx = canvas.getContext("2d");
var size = canvas.width;
var cx = size/2, cy = size/2, r = size/2 - 3;
ctx.clearRect(0,0,size,size);
var n = items.length || 1;
var sliceRad = (2*Math.PI)/n;
for (var i=0;i<n;i++){
var start = i*sliceRad - Math.PI/2;
var end = start + sliceRad;
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.arc(cx,cy,r,start,end);
ctx.closePath();
ctx.fillStyle = spinnerColorAt(i);
ctx.fill();
ctx.strokeStyle = "rgba(0,0,0,0.2)";
ctx.lineWidth = 1;
ctx.stroke();
ctx.save();
ctx.translate(cx,cy);
ctx.rotate(start + sliceRad/2);
ctx.textAlign = "right";
ctx.textBaseline = "middle";
ctx.fillStyle = "#fff";
ctx.font = "bold 12px -apple-system, sans-serif";
var label = String(items[i]);
if (label.length > 10) label = label.slice(0,9) + "…";
ctx.fillText(label, r-8, 0);
ctx.restore();
}
ctx.beginPath();
ctx.arc(cx,cy,r,0,Math.PI*2);
ctx.strokeStyle = "rgba(0,0,0,0.25)";
ctx.lineWidth = 2;
ctx.stroke();
}

function fmtTime(s){

var timerIntervals = {};

var audioCtx = null;
function getAudioCtx(){
if (!audioCtx){
var AC = window.AudioContext || window.webkitAudioContext;
if (AC) audioCtx = new AC();
}
return audioCtx;
}
function playAlarmSound(){
var ctx = getAudioCtx();
if (!ctx) return;
if (ctx.state === "suspended") ctx.resume();
var now = ctx.currentTime;
var beepTimes = [0, 0.35, 0.7, 1.05, 1.4];
for (var i=0;i<beepTimes.length;i++){
var t0 = now + beepTimes[i];
var osc = ctx.createOscillator();
var gain = ctx.createGain();
osc.type = "square";
osc.frequency.setValueAtTime(880, t0);
gain.gain.setValueAtTime(0, t0);
gain.gain.linearRampToValueAtTime(0.25, t0 + 0.02);
gain.gain.linearRampToValueAtTime(0, t0 + 0.22);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(t0);
osc.stop(t0 + 0.25);
}
}

function startTimerInterval(w, digits, btn){
stopTimerInterval(w);
w.running = true;
w.alarmPlayed = false;
var last = Date.now();
timerIntervals[w.id] = setInterval(function(){
var now = Date.now();
var dt = (now-last)/1000; last = now;
w.remaining -= dt;
if (w.remaining <= 0){
w.remaining = 0;
stopTimerInterval(w);
w.running = false;
btn.textContent = "Start";
if (!w.alarmPlayed){
w.alarmPlayed = true;
playAlarmSound();
}
}
digits.textContent = fmtTime(w.remaining);
updateTimerVisual(w, digits, btn);
saveState();
}, 250);
}
function stopTimerInterval(w){
if (timerIntervals[w.id]){ clearInterval(timerIntervals[w.id]); delete timerIntervals[w.id]; }
}
function toggleTimer(w, digits, btn){
getAudioCtx(); // warm up audio on this user tap so the alarm isn't blocked later
if (w.running){
stopTimerInterval(w);
w.running = false;
btn.textContent = "Start";
} else {
if (w.remaining <= 0) w.remaining = w.seconds;
btn.textContent = "Pause";
startTimerInterval(w, digits, btn);

}

/* ============================================================
BELL SCHEDULES
============================================================ */
function parseTimeToMinutes(str){
str = String(str).trim().toLowerCase();
var m = str.match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/);
if (!m) return null;
var h = parseInt(m[1],10), min = parseInt(m[2],10), mer = m[3];
if (h > 23 || min > 59) return null;
if (mer === "pm" && h !== 12) h += 12;
else if (mer === "am" && h === 12) h = 0;
else if (!mer){
  if (h >= 1 && h <= 6) h += 12;
}
return h*60 + min;
}
function formatMinutesLabel(mins){
mins = ((mins % 1440) + 1440) % 1440;
var h = Math.floor(mins/60), m = mins%60;
var mer = h >= 12 ? "PM" : "AM";
var h12 = h % 12; if (h12 === 0) h12 = 12;
return h12 + ":" + (m<10?"0"+m:""+m) + " " + mer;
}
function parseScheduleText(text){
var lines = text.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l; });
var periods = [];
for (var i=0;i<lines.length;i++){
  var m = lines[i].match(/^(.+?):\s*([^\-–]+?)\s*[-–]\s*(.+)$/);
  if (!m) continue;
  var start = parseTimeToMinutes(m[2]);
  var end = parseTimeToMinutes(m[3]);
  if (start === null || end === null) continue;
  periods.push({ label: m[1].trim(), start: start, end: end });
}
return periods;
}
function serializeScheduleText(periods){
return (periods||[]).map(function(p){
  return p.label + ": " + formatMinutesLabel(p.start) + " - " + formatMinutesLabel(p.end);
}).join("\n");
}
function getActiveSchedule(){
var key = todayKey();
var overrideId = state.scheduleDateOverrides && state.scheduleDateOverrides[key];
if (overrideId && state.bellSchedules[overrideId]) return state.bellSchedules[overrideId];
var day = new Date().getDay();
var assignedId = state.bellScheduleAssignments && state.bellScheduleAssignments[day];
if (assignedId && state.bellSchedules[assignedId]) return state.bellSchedules[assignedId];
return null;
}
function getCurrentPeriodLabel(){
var sched = getActiveSchedule();
if (!sched || !sched.periods || !sched.periods.length) return null;
var now = new Date();
var mins = now.getHours()*60 + now.getMinutes();
for (var i=0;i<sched.periods.length;i++){
  var p = sched.periods[i];
  if (mins >= p.start && mins < p.end){
    return p.label + ": " + formatMinutesLabel(p.start) + " - " + formatMinutesLabel(p.end);
  }
}
return null;
}

var RetroArcade = (function(){
'use strict';

let topsFn = null, stageBox = null;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const keys = {};

const PAL = { k:'#000000', r:'#d82800', s:'#fcb878', b:'#2038ec', y:'#f8d878', n:'#7c3800', h:'#7c3800',
              w:'#fcfcfc', g:'#a4a4b4', o:'#f87800',
              G:'#58d830', L:'#2c8c18', Y:'#b8f870', P:'#a040e0', R:'#f83838' };
function makeSprite(rows){
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { x.fillStyle = PAL[ch]; x.fillRect(i, j, 1, 1); } }));
  return c;
}
function flip(c){
  const f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
  const x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f;
}
function pair(rows){ const r = makeSprite(rows); return { r, l: flip(r) }; }
const TOP = ["..rrrr..",".rrrrrrr","..sssks.","..sssss.","...ss...",".bbbbbb.","sbbybbbs","s.bbbb.s","..bbbb.."];
const SP = {
  stand: pair(TOP.concat(["..b..b..","..b..b..",".nn..nn."])),
  walk1: pair(TOP.concat(["..b..b..",".b....b.","nn....nn"])),
  walk2: pair(TOP.concat(["...bb...","...bb...","..nnn..."])),
  ship: makeSprite(["....w....","...wbw...","...wbw...","..wwwww..",".rwwbwwr.","wwwwbwwww","ww.www.ww"])
};
function shade(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, '0')).join('');
}
const BALL_STYLES = [
  { name: 'LEATHER', base: '#9a5428', seam: '#3a1a08' },
  { name: 'RED WHITE BLUE', stripes: ['#d82800', '#fcfcfc', '#2038ec'] },
  { name: 'RUBBER', base: '#f87800', seam: '#201000' }
].map(s => {
  const c = document.createElement('canvas'); c.width = c.height = 9;
  const x = c.getContext('2d');
  for (let j = 0; j < 9; j++) for (let i = 0; i < 9; i++) {
    const dx = i - 4, dy = j - 4, d = dx * dx + dy * dy;
    if (d > 20) continue;
    let col;
    if (s.stripes) col = s.stripes[Math.floor((i + j + 20) / 2.4) % 3];
    else {
      col = (i + j) % 3 === 0 && s.name === 'LEATHER' ? shade(s.base, -.12) : s.base;
      if (i === 4 || j === 4 || Math.abs(Math.abs(dx) - 3) < .5 && Math.abs(dy) < 3) col = s.seam;
    }
    if (d > 13) col = shade(col, -.3);
    x.fillStyle = col; x.fillRect(i, j, 1, 1);
  }
  x.fillStyle = 'rgba(255,255,255,.55)'; x.fillRect(2, 2, 2, 1);
  return { name: s.name, img: c };
});
function makeSpriteP(rows, pal){

  const x = c.getContext('2d');

}

let AC = null, master = null, volume = 7;
function ac(){
  if (!soundOn) return null;
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.connect(AC.destination);        // every sound goes through one volume knob
    } catch(e){}
  }
  if (master) master.gain.value = Math.pow(volume / 7, 1.5);           // 7 = the original loudness, 10 a bit louder
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', vol = .06, slide = 0, delay = 0){
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .02);
}
function hiss(d, vol = .05, freq = 3000){
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d);
  s.connect(f).connect(g).connect(master); s.start();
}

function addScore(n, x, y, label){
  score = Math.max(0, score + n);

    popups.push({ x, y, text: (n > 0 ? '+' : '') + n, life: 1, col: n > 0 ? '#fcfc78' : '#f86060' });

}
function burst(x, y, n, cols, sp = 60, g = 0, life = .5){
  for (let i = 0; i < n; i++) {
    const a = i / n * 6.28 + rand(-.2, .2), s = sp * rand(.5, 1);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g, life: life * rand(.6, 1), c: cols[i % cols.length] });
  }
}
function stepFx(dt){
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 14 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
}

function makeTear(x, y){
  const R = rand(9, 15), n = 16, pts = [], cracks = [];
  for (let i = 0; i < n; i++) { const a = i / n * 6.28 + rand(-.15, .15); pts.push([Math.cos(a) * R * rand(.5, 1), Math.sin(a) * R * rand(.5, 1)]); }

function drawTears(tears){
  for (const tr of tears) {
    if (tr.k <= 0) continue;
    ctx.save(); ctx.translate(tr.x, tr.y); ctx.scale(tr.k, tr.k);
    ctx.beginPath(); tr.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.strokeStyle = 'rgba(210,210,220,.8)'; ctx.lineWidth = .8; ctx.stroke();
    ctx.beginPath();
    for (const [a, L] of tr.cracks) {
      const r0 = tr.R * .8; ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      ctx.lineTo(Math.cos(a + .2) * (r0 + L * .6), Math.sin(a + .2) * (r0 + L * .6)); ctx.lineTo(Math.cos(a - .1) * (r0 + L), Math.sin(a - .1) * (r0 + L));

/* ================= THE PLAYER + WINDOW LEDGES ================= */
const RUN = 80, GRAV = 520, JUMP_V = 230;
// the floor plus the top edge of every open window, in game pixels
function getPlats(){
  const list = [{ x1: 0, x2: W, y: H - 3, floor: true, id: 'floor' }];
  if (!topsFn || !stageBox) return list;
  const k = W / (stageBox.clientWidth || 1);
  for (const r of topsFn()) {
    const x1 = Math.max(0, r.x1 * k), x2 = Math.min(W, r.x2 * k), y = r.y * k;
    if (y < 14 || y > H - 12 || x2 - x1 < 12) continue;
    list.push({ x1, x2, y, id: r.id });
  }
  return list;
}
function drawLedges(plats){
  for (const q of plats) {
    const x = Math.round(q.x1), w = Math.round(q.x2 - q.x1), y = Math.round(q.y);
    if (q.floor) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, y - 1, W, H - y + 1);
      ctx.fillStyle = '#6a4020'; ctx.fillRect(0, y, W, H - y);
      ctx.fillStyle = '#9a6830'; ctx.fillRect(0, y, W, 1);
      continue;
    }
    ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, w + 2, 5);
    ctx.fillStyle = q.ledge ? '#a0a8c8' : '#c88848'; ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = q.ledge ? '#e0e8fc' : '#f0c078'; ctx.fillRect(x, y, w, 1);
    ctx.fillStyle = q.ledge ? '#6870a0' : '#805020';
    for (let i = x + 3; i < x + w - 1; i += 8) ctx.fillRect(i, y + 1, 1, 2);
  }
}
function newHero(){
  return { x: 24, y: H - 3, vx: 0, vy: 0, face: 1, ground: 'floor', anim: 0, air2: true, drop: 0, flipT: 0,
    jumpHeld: false, inv: 0, hurtT: 0, shootT: 0, dp: 0 };
}
function stepHero(p, dt, plats, lock){
  p.flipT = Math.max(0, p.flipT - dt); p.drop = Math.max(0, p.drop - dt);
  p.inv = Math.max(0, p.inv - dt); p.hurtT = Math.max(0, p.hurtT - dt); p.shootT -= dt;
  const mv = lock ? 0 : held('left') ? -1 : held('right') ? 1 : 0;
  const onIce = p.ground && (plats.find(q => q.id === p.ground) || {}).ice;
  if (p.hurtT <= 0) {
    if (onIce) p.vx += (mv * RUN - p.vx) * Math.min(1, dt * 1.5);      // ice: slow to start, slides when you stop
    else p.vx = mv * RUN;
    if (mv) p.face = mv;
  }
  if (p.ground && p.vx) p.anim += dt * 10;
  p.x = clamp(p.x + p.vx * dt, 4, W - 4);
  if (p.ground) {
    const q = plats.find(q => q.id === p.ground);
    if (!q || p.x + 3 <= q.x1 || p.x - 3 >= q.x2) { p.ground = null; p.vy = 0; } else p.y = q.y;
  }
  if (!p.ground) {
    p.vy = Math.min(p.vy + GRAV * dt, 400);
    if (!p.jumpHeld && p.vy < -120) p.vy = -120;                       // let go of ▲ early = shorter hop
    const py = p.y; p.y += p.vy * dt;
    if (p.vy >= 0) {
      let best = null;
      for (const q of plats) {
        if ((q.floor || p.drop <= 0) && py <= q.y + .5 && p.y >= q.y && p.x + 3 > q.x1 && p.x - 3 < q.x2 && (!best || q.y < best.y)) best = q;
      }
      if (best) { p.y = best.y; p.vy = 0; p.ground = best.id; p.air2 = true; }
    }
    if (p.y < 14) { p.y = 14; if (p.vy < 0) p.vy = 0; }
  }
}
function heroKey(p, k){

  if (k !== 'ArrowUp') return;
  if (p.ground) { p.ground = null; p.vy = -JUMP_V; p.jumpHeld = true; tone(300, .1, 'square', .04, 300); return; }
  if (!p.air2) return;                                                 // double jump: one more hop in mid-air
  p.air2 = false; p.vy = -JUMP_V * .85; p.jumpHeld = true; p.flipT = .3;

/* =====================================================================

function HoopsGame(){
  const BR = 4, G = 230, ANG = 60 * Math.PI / 180, RIM_W = 19;
  let t = 0, left = 60, made = 0, netT = 0, meter = null, rimSnd = 0, birdT = rand(5, 8), birds = [], hoop = null, moveT = 0, noBallT = 0;
  let hearts = 3, streak = 0, poops = [], splats = [];

  const sideLedges = [];
  for (let y = H - 3 - 46, i = 0; y > 26; y -= 46, i++) {
    sideLedges.push({ x1: 0, x2: 18, y, id: 'ledgeL' + i, ledge: true });
    sideLedges.push({ x1: W - 18, x2: W, y, id: 'ledgeR' + i, ledge: true });
  }
  // a ledge never sits in front of, under or over the hoop (rim, net, board, pole, or the space the ball drops through)
  const blocksHoop = q => {
    const x1 = Math.min(hoop.rl, hoop.bx) - 8, x2 = Math.max(hoop.rr, hoop.bx + 4) + 8;
    return q.x2 > x1 && q.x1 < x2 && q.y > hoop.y - 44 && q.y < hoop.base + 4;
  };
  const allPlats = () => getPlats().concat(hoop ? sideLedges.filter(q => !blocksHoop(q)) : sideLedges);
  let plats = allPlats();
  const p = newHero();
  const balls = BALL_STYLES.map((s, i) => ({ img: s.img, x: 40 + i * 16, y: H - 3 - BR, vx: 0, vy: 0, rot: 0, free: true, live: false, noPick: 0, rest: 0 }));
  p.ball = balls[0]; balls[0].free = false;
  const air = () => !p.ground;
  const hoopX = () => (hoop.rl + hoop.rr) / 2;

  function placeHoop(){
    const cands = plats.filter(q => !q.floor && !q.ledge && q.x2 - q.x1 >= 40 && q.y - 34 > 16 && (!hoop || q.id !== hoop.plat));
    let q = cands.length ? pick(cands) : null, side, rimY, bx;
    if (q) { side = (q.x1 + q.x2) / 2 > W / 2 ? 1 : -1; rimY = q.y - 30; bx = side > 0 ? Math.round(q.x2 - 6) : Math.round(q.x1 + 3); }
    else { q = plats[0]; side = 1; rimY = H - 3 - 46; bx = W - 10; }
    const rl = side > 0 ? bx - 1 - RIM_W : bx + 4;
    hoop = { plat: q.id, base: q.y, side, bx, rl, rr: rl + RIM_W, y: rimY };
    burst(hoopX(), rimY, 12, ['#fcfcfc', '#f83800'], 50);
  }
  placeHoop();

  function shoot(){
    const b = p.ball, v = 165 + meter.p * 105;
    b.free = true; b.live = true; b.scored = false; b.from = p.x; b.noPick = .6; b.rest = 0; b.ret = false;
    b.shot = true; b.birdHit = false;                                  // a fresh shot: it either goes in or counts as a miss
    b.x = p.x + p.face * 2; b.y = p.y - 17;
    b.vx = p.face * v * Math.cos(ANG); b.vy = -v * Math.sin(ANG);
    p.ball = null; meter = null; noBallT = 0; sfx.dribble();
  }
  function grab(b){ p.ball = b; b.free = false; b.live = false; meter = null; noBallT = 0; sfx.dribble(); }

  function spawnBird(){
    const k = pick(HOOP_BIRDS), dir = Math.random() < .5 ? 1 : -1;
    birds.push({ k, dir, x: dir > 0 ? -14 : W + 14, y0: rand(20, H * .6), y: 0, sp: rand(32, 52), f: rand(0, 2), bob: rand(0, 6.28), hit: 0,
      mode: 'fly', vx: 0, vy: 0, t: 0, poopT: rand(1.5, 4) });
    sfx.tweet();
  }
  function birdBonk(b, bd){
    const cx = bd.x, cy = bd.y + 3, dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy);
    if (d > 8 || d === 0 || bd.hit > 0) return;
    const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= 1.7 * vn * nx; b.vy -= 1.7 * vn * ny; }

    bd.hit = .5;
    if (b.live) b.birdHit = true;
    burst(cx, cy, 10, [bd.k.col, '#fcfcfc'], 45, 40, .8);
    tone(1500, .08, 'square', .04, -700); tone(1100, .08, 'square', .04, 500, .07);

      bd.mode = 'dive'; bd.t = 0; bd.vx = bd.dir * bd.sp; bd.vy = 0;
      popups.push({ x: cx, y: cy - 8, text: 'SQUAWK!', life: .9, col: '#f86060' });
